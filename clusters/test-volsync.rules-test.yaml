# promtool unit tests for the volsync and snapshot-controller alert rules
# that test-volsync.nix renders. The rules-cluster-volsync check runs them
# from the rendered rules, so each rule_files entry is <namespace>/<file> in
# the cluster's manifests. Every rule file loads in every test, so a test
# that expects no alert gives each instance healthy series.
rule_files:
  - volsync/volsync-alerts-prometheusrule.yaml
  - storage/snapshot-controller-alerts-prometheusrule.yaml
evaluation_interval: 1m
tests:
  # Both operators stop answering.
  - interval: 1m
    input_series:
      - series: 'up{namespace="volsync",service="volsync-metrics",instance="10.0.0.1:8080"}'
        values: '1 1 0x15'
      - series: 'up{namespace="storage",service="snapshot-controller-metrics",instance="10.0.0.2:8080"}'
        values: '1 1 0x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: VolSyncOperatorDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: volsync
              service: volsync-metrics
            exp_annotations:
              summary: "The VolSync operator is down."
              description: "The VolSync operator volsync/volsync has not answered a scrape for 10 minutes. No backup or restore starts while it is down, and VolSyncVolumeOutOfSync cannot fire. Check the operator Deployment in volsync."
      - eval_time: 14m
        alertname: SnapshotControllerDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: storage
              service: snapshot-controller-metrics
            exp_annotations:
              summary: "The CSI snapshot controller is down."
              description: "The snapshot controller storage/snapshot-controller has not answered a scrape for 10 minutes. VolumeSnapshots are neither created nor deleted while it is down, so backups that take snapshots stall. Check its Deployment in storage."
  # Neither is scraped at all: absent() keeps namespace and service.
  - interval: 1m
    input_series:
      - series: 'up{namespace="other",service="other",instance="10.0.0.9:8080"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: VolSyncOperatorDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: volsync
              service: volsync-metrics
            exp_annotations:
              summary: "The VolSync operator is down."
              description: "The VolSync operator volsync/volsync has not answered a scrape for 10 minutes. No backup or restore starts while it is down, and VolSyncVolumeOutOfSync cannot fire. Check the operator Deployment in volsync."
      - eval_time: 12m
        alertname: SnapshotControllerDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: storage
              service: snapshot-controller-metrics
            exp_annotations:
              summary: "The CSI snapshot controller is down."
              description: "The snapshot controller storage/snapshot-controller has not answered a scrape for 10 minutes. VolumeSnapshots are neither created nor deleted while it is down, so backups that take snapshots stall. Check its Deployment in storage."
  # A ReplicationSource stays out of sync for over an hour.
  - interval: 1m
    input_series:
      - series: 'up{namespace="volsync",service="volsync-metrics",instance="10.0.0.1:8080"}'
        values: '1x80'
      - series: 'volsync_volume_out_of_sync{namespace="volsync",service="volsync-metrics",instance="10.0.0.1:8080",obj_namespace="volsync-smoke",obj_name="data",role="source",method="restic"}'
        values: '0 0 1x78'
    alert_rule_test:
      - eval_time: 70m
        alertname: VolSyncVolumeOutOfSync
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: volsync
              service: volsync-metrics
              obj_namespace: volsync-smoke
              obj_name: data
              role: source
            exp_annotations:
              summary: "A VolSync replication is out of sync."
              description: "The VolSync source volsync-smoke/data has not completed a sync since it was created, or missed its schedule, for an hour, so its copy is older than the schedule promises. Read the resource's status conditions and the log of its latest mover Job in volsync-smoke."
  # Healthy: both answer, and a sync that ran late for half an hour caught
  # up before the hour passed.
  - interval: 1m
    input_series:
      - series: 'up{namespace="volsync",service="volsync-metrics",instance="10.0.0.1:8080"}'
        values: '1x80'
      - series: 'up{namespace="storage",service="snapshot-controller-metrics",instance="10.0.0.2:8080"}'
        values: '1x80'
      - series: 'volsync_volume_out_of_sync{namespace="volsync",service="volsync-metrics",instance="10.0.0.1:8080",obj_namespace="volsync-smoke",obj_name="data",role="source",method="restic"}'
        values: '0x10 1x30 0x40'
    alert_rule_test:
      - eval_time: 75m
        alertname: VolSyncOperatorDown
        exp_alerts: []
      - eval_time: 75m
        alertname: VolSyncVolumeOutOfSync
        exp_alerts: []
      - eval_time: 75m
        alertname: SnapshotControllerDown
        exp_alerts: []
