# promtool unit tests for the openbao alert rules test-openbao.nix renders.
# The rules-cluster-openbao check runs them from the rendered rules, so each
# rule_files entry is <namespace>/<file> in the cluster's manifests.
# `openbao` runs one pod; `openbao-ha` runs three, so it also renders
# OpenBaoSealed and OpenBaoRaftUnhealthy. Every rule file loads in every
# test, so a test that expects no alert gives each instance healthy series.
rule_files:
  - secrets/openbao-alerts-prometheusrule.yaml
  - secrets-ha/openbao-ha-alerts-prometheusrule.yaml
evaluation_interval: 1m
tests:
  # The one pod of openbao stops answering.
  - interval: 1m
    input_series:
      - series: 'up{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202"}'
        values: '1 1 0x15'
      - series: 'up{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x17'
    alert_rule_test:
      - eval_time: 14m
        alertname: OpenBaoDown
        exp_alerts:
          - exp_labels:
              severity: "critical"
              namespace: "secrets"
              service: "openbao-metrics"
            exp_annotations:
              summary: "OpenBao is down."
              description: "No pod of OpenBao secrets/openbao has answered a scrape for 10 minutes, so clients cannot read secrets. Check the pods of the StatefulSet openbao in secrets."
  # Both instances answer.
  - interval: 1m
    input_series:
      - series: 'up{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202"}'
        values: '1x15'
      - series: 'up{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenBaoDown
        exp_alerts: []
  # The one pod of openbao is sealed. One of the three pods of openbao-ha is
  # sealed while the others are not.
  - interval: 1m
    input_series:
      - series: 'vault_core_unsealed{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202"}'
        values: '0x15'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x15'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-1",instance="10.0.1.2:8202"}'
        values: '0x15'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-2",instance="10.0.1.3:8202"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenBaoAllSealed
        exp_alerts:
          - exp_labels:
              severity: "critical"
              namespace: "secrets"
              service: "openbao-metrics"
            exp_annotations:
              summary: "Every OpenBao pod is sealed."
              description: "Every pod of OpenBao secrets/openbao has been sealed for 5 minutes, so OpenBao serves no request. The pods unseal themselves with the key in the unsealKey Secret; check that Secret and the pod logs."
      - eval_time: 12m
        alertname: OpenBaoSealed
        exp_alerts:
          - exp_labels:
              severity: "warning"
              namespace: "secrets-ha"
              service: "openbao-ha-metrics"
              pod: "openbao-ha-1"
            exp_annotations:
              summary: "An OpenBao pod is sealed."
              description: "Pod openbao-ha-1 of OpenBao secrets-ha/openbao-ha has been sealed for 10 minutes, so it serves no request and one more lost pod stops OpenBao. It unseals itself with the key in the unsealKey Secret; check that Secret and the pod log."
  # Every pod of openbao-ha is sealed: OpenBaoAllSealed reports it, not an
  # OpenBaoSealed per pod. openbao is unsealed.
  - interval: 1m
    input_series:
      - series: 'vault_core_unsealed{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202"}'
        values: '1x15'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '0x15'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-1",instance="10.0.1.2:8202"}'
        values: '0x15'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-2",instance="10.0.1.3:8202"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenBaoSealed
        exp_alerts: []
      - eval_time: 12m
        alertname: OpenBaoAllSealed
        exp_alerts:
          - exp_labels:
              severity: "critical"
              namespace: "secrets-ha"
              service: "openbao-ha-metrics"
            exp_annotations:
              summary: "Every OpenBao pod is sealed."
              description: "Every pod of OpenBao secrets-ha/openbao-ha has been sealed for 5 minutes, so OpenBao serves no request. The pods unseal themselves with the key in the unsealKey Secret; check that Secret and the pod logs."
  # openbao-ha-2 sealed while it was the active pod and still exports
  # vault_core_active 1; the two unsealed pods are standbys.
  - interval: 1m
    input_series:
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x10'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-1",instance="10.0.1.2:8202"}'
        values: '1x10'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-2",instance="10.0.1.3:8202"}'
        values: '0x10'
      - series: 'vault_core_active{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '0x10'
      - series: 'vault_core_active{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-1",instance="10.0.1.2:8202"}'
        values: '0x10'
      - series: 'vault_core_active{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-2",instance="10.0.1.3:8202"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: OpenBaoNoActiveNode
        exp_alerts:
          - exp_labels:
              severity: "critical"
              namespace: "secrets-ha"
              service: "openbao-ha-metrics"
            exp_annotations:
              summary: "OpenBao has no active pod."
              description: "Pods of OpenBao secrets-ha/openbao-ha are unsealed but none has been active for 5 minutes, so requests fail. The pods cannot elect a Raft leader; check their logs and `bao operator raft list-peers`."
  # openbao-ha-0 is unsealed and active.
  - interval: 1m
    input_series:
      - series: 'vault_core_unsealed{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202"}'
        values: '1x10'
      - series: 'vault_core_active{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202"}'
        values: '1x10'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x10'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-1",instance="10.0.1.2:8202"}'
        values: '1x10'
      - series: 'vault_core_active{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x10'
      - series: 'vault_core_active{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-1",instance="10.0.1.2:8202"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: OpenBaoNoActiveNode
        exp_alerts: []
  # Every pod is unsealed and each instance has an active pod. Each pod also
  # still exports the vault_core_unsealed 0 without a cluster label that it
  # reported before its first unseal.
  - interval: 1m
    input_series:
      - series: 'up{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202"}'
        values: '1x20'
      - series: 'vault_core_unsealed{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202"}'
        values: '0x20'
      - series: 'vault_core_unsealed{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202",cluster="vault-cluster-0a1b2c3d"}'
        values: '1x20'
      - series: 'vault_core_active{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202",cluster="vault-cluster-0a1b2c3d"}'
        values: '1x20'
      - series: 'up{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x20'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '0x20'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202",cluster="vault-cluster-0a1b2c3d"}'
        values: '1x20'
      - series: 'vault_core_active{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202",cluster="vault-cluster-0a1b2c3d"}'
        values: '1x20'
      - series: 'up{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-1",instance="10.0.1.2:8202"}'
        values: '1x20'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-1",instance="10.0.1.2:8202"}'
        values: '0x20'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-1",instance="10.0.1.2:8202",cluster="vault-cluster-0a1b2c3d"}'
        values: '1x20'
      - series: 'vault_core_active{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-1",instance="10.0.1.2:8202",cluster="vault-cluster-0a1b2c3d"}'
        values: '0x20'
      - series: 'up{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-2",instance="10.0.1.3:8202"}'
        values: '1x20'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-2",instance="10.0.1.3:8202"}'
        values: '0x20'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-2",instance="10.0.1.3:8202",cluster="vault-cluster-0a1b2c3d"}'
        values: '1x20'
      - series: 'vault_core_active{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-2",instance="10.0.1.3:8202",cluster="vault-cluster-0a1b2c3d"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 17m
        alertname: OpenBaoAllSealed
        exp_alerts: []
      - eval_time: 17m
        alertname: OpenBaoSealed
        exp_alerts: []
      - eval_time: 17m
        alertname: OpenBaoNoActiveNode
        exp_alerts: []
      - eval_time: 17m
        alertname: OpenBaoMetricsMissing
        exp_alerts: []
  # Every request openbao audits fails to log, one a minute.
  - interval: 1m
    input_series:
      - series: 'vault_audit_log_request_failure{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202"}'
        values: '0+1x15'
      - series: 'vault_audit_log_response_failure{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: OpenBaoAuditFailing
        exp_alerts:
          - exp_labels:
              severity: "critical"
              namespace: "secrets"
              service: "openbao-metrics"
            exp_annotations:
              summary: "OpenBao refuses requests it cannot audit."
              description: "No audit device of OpenBao secrets/openbao could log some requests in the last 10 minutes, so OpenBao refused them. Check the audit devices (`bao audit list`) and the space or endpoint they write to."
  # Audited requests, none failed.
  - interval: 1m
    input_series:
      - series: 'vault_audit_log_request_failure{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202"}'
        values: '0x15'
      - series: 'vault_audit_log_response_failure{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: OpenBaoAuditFailing
        exp_alerts: []
  # openbao is scraped but reports no vault_core_unsealed; openbao-ha does.
  - interval: 1m
    input_series:
      - series: 'up{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202"}'
        values: '1x20'
      - series: 'up{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x20'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 17m
        alertname: OpenBaoMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: "warning"
              namespace: "secrets"
              service: "openbao-metrics"
            exp_annotations:
              summary: "OpenBao reports no metrics."
              description: "The pods of OpenBao secrets/openbao are scraped but report no vault_core_unsealed, so the seal and leader alerts cannot fire. Check `settings.telemetry` for a filter that drops the vault.core metrics, and the server log."
  # Both instances report vault_core_unsealed.
  - interval: 1m
    input_series:
      - series: 'up{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202"}'
        values: '1x20'
      - series: 'vault_core_unsealed{namespace="secrets",service="openbao-metrics",job="openbao-metrics",pod="openbao-0",instance="10.0.0.1:8202"}'
        values: '1x20'
      - series: 'up{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x20'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 17m
        alertname: OpenBaoMetricsMissing
        exp_alerts: []
  # The active pod openbao-ha-0 reports an unhealthy peer and no failure
  # tolerance.
  - interval: 1m
    input_series:
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x15'
      - series: 'vault_core_active{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x15'
      - series: 'vault_autopilot_healthy{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '0x15'
      - series: 'vault_autopilot_failure_tolerance{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenBaoRaftUnhealthy
        exp_alerts:
          - exp_labels:
              severity: "warning"
              namespace: "secrets-ha"
              service: "openbao-ha-metrics"
            exp_annotations:
              summary: "OpenBao's Raft cluster is degraded."
              description: "The active pod of OpenBao secrets-ha/openbao-ha reports an unhealthy Raft peer or no failure tolerance, so losing one more pod stops OpenBao. Check `bao operator raft autopilot state` and the pods that it names."
  # The active pod openbao-ha-0 reports a healthy cluster. openbao-ha-1, the
  # leader before it, still exports the unhealthy values it had then.
  - interval: 1m
    input_series:
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x15'
      - series: 'vault_core_active{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x15'
      - series: 'vault_autopilot_healthy{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x15'
      - series: 'vault_autopilot_failure_tolerance{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-0",instance="10.0.1.1:8202"}'
        values: '1x15'
      - series: 'vault_core_unsealed{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-1",instance="10.0.1.2:8202"}'
        values: '1x15'
      - series: 'vault_core_active{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-1",instance="10.0.1.2:8202"}'
        values: '0x15'
      - series: 'vault_autopilot_healthy{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-1",instance="10.0.1.2:8202"}'
        values: '0x15'
      - series: 'vault_autopilot_failure_tolerance{namespace="secrets-ha",service="openbao-ha-metrics",job="openbao-ha-metrics",pod="openbao-ha-1",instance="10.0.1.2:8202"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenBaoRaftUnhealthy
        exp_alerts: []
