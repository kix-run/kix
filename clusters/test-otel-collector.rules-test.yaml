# promtool unit tests for the alert rules test-otel-collector.nix renders.
# The rules-cluster-otel-collector check runs them from the rendered rules,
# so each rule_files entry is <namespace>/<file> in the cluster's manifests.
rule_files:
  - observability/agent-alerts-prometheusrule.yaml
  - observability/gateway-alerts-prometheusrule.yaml
evaluation_interval: 1m
tests:
  # One agent of two stops answering: that is TargetDown's, so nothing
  # fires here.
  - interval: 1m
    input_series:
      - series: 'up{namespace="observability",service="agent",instance="10.0.0.1:8888"}'
        values: '1 1 0x14'
      - series: 'up{namespace="observability",service="agent",instance="10.0.0.2:8888"}'
        values: '1x16'
      - series: 'up{namespace="observability",service="gateway",instance="10.0.0.3:8888"}'
        values: '1x16'
    alert_rule_test:
      - eval_time: 14m
        alertname: OtelCollectorDown
        exp_alerts: []
  # Every agent stops answering: the alert fires once `for` (10m) has passed.
  - interval: 1m
    input_series:
      - series: 'up{namespace="observability",service="agent",instance="10.0.0.1:8888"}'
        values: '1 1 0x14'
      - series: 'up{namespace="observability",service="agent",instance="10.0.0.2:8888"}'
        values: '1 1 0x14'
      - series: 'up{namespace="observability",service="gateway",instance="10.0.0.3:8888"}'
        values: '1x16'
    alert_rule_test:
      - eval_time: 14m
        alertname: OtelCollectorDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: observability
              service: agent
            exp_annotations:
              summary: An OpenTelemetry Collector is down.
              description: Prometheus has scraped no collector of observability/agent for 10 minutes; telemetry sent to it is lost. Check the instance's pods.
  # The gateway has no target at all: absent() fires with the selector's
  # labels, while the agent's healthy series keep its alert quiet.
  - interval: 1m
    input_series:
      - series: 'up{namespace="observability",service="agent",instance="10.0.0.1:8888"}'
        values: '1x16'
    alert_rule_test:
      - eval_time: 14m
        alertname: OtelCollectorDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: observability
              service: gateway
            exp_annotations:
              summary: An OpenTelemetry Collector is down.
              description: Prometheus has scraped no collector of observability/gateway for 10 minutes; telemetry sent to it is lost. Check the instance's pods.
  # Healthy targets fire nothing.
  - interval: 1m
    input_series:
      - series: 'up{namespace="observability",service="agent",instance="10.0.0.1:8888"}'
        values: '1x16'
      - series: 'up{namespace="observability",service="gateway",instance="10.0.0.3:8888"}'
        values: '1x16'
    alert_rule_test:
      - eval_time: 14m
        alertname: OtelCollectorDown
        exp_alerts: []
