# promtool unit tests for the spegel alert rules that test-spegel.nix
# renders. The rules-cluster-spegel check runs them from the rendered rules,
# so the rule_files entry is <namespace>/<file> in the cluster's manifests.
rule_files:
  - spegel/spegel-alerts-prometheusrule.yaml
evaluation_interval: 1m
tests:
  # Every Spegel pod stops answering.
  - interval: 1m
    input_series:
      - series: 'up{namespace="spegel",service="spegel-metrics",pod="spegel-a",instance="10.0.0.1:9090"}'
        values: '1 1 0x15'
      - series: 'up{namespace="spegel",service="spegel-metrics",pod="spegel-b",instance="10.0.0.2:9090"}'
        values: '1 1 0x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: SpegelDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: spegel
              service: spegel-metrics
            exp_annotations:
              summary: "Spegel is down on every node."
              description: "No pod of Spegel spegel/spegel has answered a scrape for 10 minutes. containerd pulls every image from the upstream registries meanwhile, which can hit their rate limits. Check the DaemonSet in spegel."
  # No Spegel target at all: absent() keeps namespace and service.
  - interval: 1m
    input_series:
      - series: 'up{namespace="other",service="other",instance="10.0.0.9:9090"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: SpegelDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: spegel
              service: spegel-metrics
            exp_annotations:
              summary: "Spegel is down on every node."
              description: "No pod of Spegel spegel/spegel has answered a scrape for 10 minutes. containerd pulls every image from the upstream registries meanwhile, which can hit their rate limits. Check the DaemonSet in spegel."
  # One node's pod down stays quiet here (TargetDown reports it).
  - interval: 1m
    input_series:
      - series: 'up{namespace="spegel",service="spegel-metrics",pod="spegel-a",instance="10.0.0.1:9090"}'
        values: '1 1 0x15'
      - series: 'up{namespace="spegel",service="spegel-metrics",pod="spegel-b",instance="10.0.0.2:9090"}'
        values: '1x17'
    alert_rule_test:
      - eval_time: 14m
        alertname: SpegelDown
        exp_alerts: []
