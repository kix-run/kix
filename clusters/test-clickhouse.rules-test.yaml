              description: "For 5 minutes ClickHouse Keeper analytics-ha/keeper has had no leader, or a leader with too few in-sync followers for a majority of its 3 replicas, so it accepts no writes and replicated tables on the servers go read-only. Check that a majority of its replicas run and reach each other on the raft port, and read their logs."
