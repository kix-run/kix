# promtool unit tests for the nats alert rules test-nats.nix renders for
# messaging-prod/nats (three servers, JetStream on). The rules-cluster-nats
# check runs them from the rendered rules, so the rule_files entry is
# <namespace>/<file> in the cluster's manifests. Each rule has a fixture
# that fires it and the healthy fixture, in which none fires.
rule_files:
  - messaging-prod/nats-alerts-prometheusrule.yaml
evaluation_interval: 1m
tests:
  # Three healthy servers fire nothing.
  - interval: 1m
    input_series:
      - series: 'nats_varz_connections{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-0",instance="10.0.0.1:7777",server_id="S0"}'
        values: '10x40'
      - series: 'nats_varz_max_connections{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-0",instance="10.0.0.1:7777",server_id="S0"}'
        values: '100x40'
      - series: 'nats_varz_slow_consumers{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-0",instance="10.0.0.1:7777",server_id="S0"}'
        values: '0x40'
      - series: 'nats_healthz_status{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-0",instance="10.0.0.1:7777",server_id="S0"}'
        values: '0x40'
      - series: 'nats_varz_jetstream_stats_storage{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-0",instance="10.0.0.1:7777",server_id="S0"}'
        values: '1048576x40'
      - series: 'nats_varz_jetstream_config_max_storage{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-0",instance="10.0.0.1:7777",server_id="S0"}'
        values: '1073741824x40'
      - series: 'nats_varz_connections{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-1",instance="10.0.0.2:7777",server_id="S1"}'
        values: '10x40'
      - series: 'nats_varz_max_connections{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-1",instance="10.0.0.2:7777",server_id="S1"}'
        values: '100x40'
      - series: 'nats_varz_slow_consumers{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-1",instance="10.0.0.2:7777",server_id="S1"}'
        values: '0x40'
      - series: 'nats_healthz_status{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-1",instance="10.0.0.2:7777",server_id="S1"}'
        values: '0x40'
      - series: 'nats_varz_jetstream_stats_storage{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-1",instance="10.0.0.2:7777",server_id="S1"}'
        values: '1048576x40'
      - series: 'nats_varz_jetstream_config_max_storage{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-1",instance="10.0.0.2:7777",server_id="S1"}'
        values: '1073741824x40'
      - series: 'nats_varz_connections{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-2",instance="10.0.0.3:7777",server_id="S2"}'
        values: '10x40'
      - series: 'nats_varz_max_connections{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-2",instance="10.0.0.3:7777",server_id="S2"}'
        values: '100x40'
      - series: 'nats_varz_slow_consumers{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-2",instance="10.0.0.3:7777",server_id="S2"}'
        values: '0x40'
      - series: 'nats_healthz_status{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-2",instance="10.0.0.3:7777",server_id="S2"}'
        values: '0x40'
      - series: 'nats_varz_jetstream_stats_storage{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-2",instance="10.0.0.3:7777",server_id="S2"}'
        values: '1048576x40'
      - series: 'nats_varz_jetstream_config_max_storage{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-2",instance="10.0.0.3:7777",server_id="S2"}'
        values: '1073741824x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: NATSMetricsAbsent
        exp_alerts: []
      - eval_time: 30m
        alertname: NATSServerUnhealthy
        exp_alerts: []
      - eval_time: 30m
        alertname: NATSConnectionsNearLimit
        exp_alerts: []
      - eval_time: 30m
        alertname: NATSSlowConsumers
        exp_alerts: []
      - eval_time: 30m
        alertname: NATSJetStreamStorageNearLimit
        exp_alerts: []
  # No exporter reports a server: absent() keeps namespace and service.
  - interval: 1m
    input_series:
      - series: 'up{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-0",instance="10.0.0.1:7777"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: NATSMetricsAbsent
        exp_alerts: []
      - eval_time: 7m
        alertname: NATSMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: "critical"
              namespace: "messaging-prod"
              service: "nats-metrics"
            exp_annotations:
              description: "Prometheus has received no server metrics from NATS messaging-prod/nats for 5 minutes. The pods may be down or `Pending`, or `nats-server` may not be responding on port 8222. Run `kubectl get pods -n messaging-prod` and check the `nats` container logs."
              summary: "No server metrics reported for NATS"
  # nats-1 fails /healthz from minute 5.
  - interval: 1m
    input_series:
      - series: 'nats_healthz_status{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-1",instance="10.0.0.2:7777",server_id="S1"}'
        values: '0x4 1x20'
      - series: 'nats_healthz_status{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-0",instance="10.0.0.1:7777",server_id="S0"}'
        values: '0x25'
    alert_rule_test:
      - eval_time: 12m
        alertname: NATSServerUnhealthy
        exp_alerts: []
      - eval_time: 20m
        alertname: NATSServerUnhealthy
        exp_alerts:
          - exp_labels:
              severity: "warning"
              namespace: "messaging-prod"
              service: "nats-metrics"
              pod: "nats-1"
            exp_annotations:
              description: "`/healthz` on pod nats-1 (NATS messaging-prod/nats) has failed for 10 minutes. JetStream may have no metadata leader, or a stream or consumer may be behind. Check the `nats` container logs with `kubectl logs -n messaging-prod nats-1 -c nats`."
              summary: "NATS server health check is failing"
  # nats-0 holds 95 of 100 connections.
  - interval: 1m
    input_series:
      - series: 'nats_varz_connections{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-0",instance="10.0.0.1:7777",server_id="S0"}'
        values: '95x20'
      - series: 'nats_varz_max_connections{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-0",instance="10.0.0.1:7777",server_id="S0"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: NATSConnectionsNearLimit
        exp_alerts:
          - exp_labels:
              severity: "warning"
              namespace: "messaging-prod"
              service: "nats-metrics"
              pod: "nats-0"
              job: "nats-metrics"
              instance: "10.0.0.1:7777"
              server_id: "S0"
            exp_annotations:
              description: "Pod nats-0 (NATS messaging-prod/nats) is using 95% of `max_connections`. At 100%, the server rejects new client connections. Close idle client connections or increase `settings.max_connections`."
              summary: "NATS server is near its connection limit"
  # nats-0 marks a slow consumer every minute.
  - interval: 1m
    input_series:
      - series: 'nats_varz_slow_consumers{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-0",instance="10.0.0.1:7777",server_id="S0"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: NATSSlowConsumers
        exp_alerts:
          - exp_labels:
              severity: "warning"
              namespace: "messaging-prod"
              service: "nats-metrics"
              pod: "nats-0"
              job: "nats-metrics"
              instance: "10.0.0.1:7777"
              server_id: "S0"
            exp_annotations:
              description: "Pod nats-0 (NATS messaging-prod/nats) dropped messages for slow client connections in the last 10 minutes. Inspect connections by pending bytes with `kubectl exec -n messaging-prod nats-0 -c nats -- wget -qO- 'http://localhost:8222/connz?sort=pending'`."
              summary: "NATS server is dropping messages for slow consumers"
  # nats-0 stores 95% of its JetStream limit.
  - interval: 1m
    input_series:
      - series: 'nats_varz_jetstream_stats_storage{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-0",instance="10.0.0.1:7777",server_id="S0"}'
        values: '1020054733x20'
      - series: 'nats_varz_jetstream_config_max_storage{namespace="messaging-prod",service="nats-metrics",job="nats-metrics",pod="nats-0",instance="10.0.0.1:7777",server_id="S0"}'
        values: '1073741824x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: NATSJetStreamStorageNearLimit
        exp_alerts:
          - exp_labels:
              severity: "warning"
              namespace: "messaging-prod"
              service: "nats-metrics"
              pod: "nats-0"
              job: "nats-metrics"
              instance: "10.0.0.1:7777"
              server_id: "S0"
            exp_annotations:
              description: "Pod nats-0 (NATS messaging-prod/nats) is using 95% of `max_file_store`. At 100%, publishes to file-backed streams fail. Lower stream retention limits, or raise `settings.jetstream.max_file_store` if the `/data` volume has free space. Kubernetes cannot change a StatefulSet's `volumeClaimTemplates` in place, so changing `storage.size` does not resize existing PersistentVolumeClaims."
              summary: "NATS JetStream file storage is nearly full"
