# promtool unit tests for the external-dns alert rules that
# test-external-dns.nix renders, through the `nodes` instance (interval 1m,
# so the stale threshold is the 15-minute floor). The
# rules-cluster-external-dns check runs them from the rendered rules, so the
# rule_files entry is <namespace>/<file> in the cluster's manifests.
rule_files:
  - external-dns/nodes-alerts-prometheusrule.yaml
evaluation_interval: 1m
tests:
  # The pod stops answering.
  - interval: 1m
    input_series:
      - series: 'up{namespace="external-dns",service="nodes",instance="10.0.0.1:7979"}'
        values: '1 1 0x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: ExternalDNSDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: external-dns
              service: nodes
            exp_annotations:
              summary: "external-dns is down."
              description: "external-dns external-dns/nodes has not answered a scrape for 10 minutes. The records it published stay in place, but new and changed hostnames are not published. Check its Deployment in external-dns."
  # No target at all: absent() keeps namespace and service.
  - interval: 1m
    input_series:
      - series: 'up{namespace="other",service="other",instance="10.0.0.9:7979"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: ExternalDNSDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: external-dns
              service: nodes
            exp_annotations:
              summary: "external-dns is down."
              description: "external-dns external-dns/nodes has not answered a scrape for 10 minutes. The records it published stay in place, but new and changed hostnames are not published. Check its Deployment in external-dns."
  # The last successful synchronization was at 1m; later runs fail.
  - interval: 1m
    input_series:
      - series: 'up{namespace="external-dns",service="nodes",instance="10.0.0.1:7979"}'
        values: '1x30'
      - series: 'external_dns_controller_last_sync_timestamp_seconds{namespace="external-dns",service="nodes",instance="10.0.0.1:7979"}'
        values: '0 60x29'
    alert_rule_test:
      - eval_time: 25m
        alertname: ExternalDNSSyncStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: external-dns
              service: nodes
            exp_annotations:
              summary: "external-dns has not synchronized DNS records recently."
              description: "external-dns external-dns/nodes last synchronized with its DNS provider 24m 0s ago, more than three intervals, so DNS records do not follow changed hostnames. Look in its log for provider API errors, such as HTTP 429 rate limiting or a refused credential, and for source errors."
  # Healthy: it answers and synchronizes every minute.
  - interval: 1m
    input_series:
      - series: 'up{namespace="external-dns",service="nodes",instance="10.0.0.1:7979"}'
        values: '1x30'
      - series: 'external_dns_controller_last_sync_timestamp_seconds{namespace="external-dns",service="nodes",instance="10.0.0.1:7979"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: ExternalDNSDown
        exp_alerts: []
      - eval_time: 25m
        alertname: ExternalDNSSyncStale
        exp_alerts: []
