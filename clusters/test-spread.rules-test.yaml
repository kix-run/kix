# promtool unit tests for the descheduler alert rules that test-spread.nix
# renders. The rules-cluster-spread check runs them from the rendered rules,
# so the rule_files entry is <namespace>/<file> in the cluster's manifests.
rule_files:
  - descheduler/descheduler-alerts-prometheusrule.yaml
evaluation_interval: 1m
tests:
  # The descheduler stops answering.
  - interval: 1m
    input_series:
      - series: 'up{namespace="descheduler",service="descheduler-metrics",instance="10.0.0.1:10258"}'
        values: '1 1 0x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: DeschedulerDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: descheduler
              service: descheduler-metrics
            exp_annotations:
              summary: "The descheduler is down."
              description: "No replica of the descheduler descheduler/descheduler has answered a scrape for 10 minutes, so pods that break their placement rules or crowd busy nodes stay where they are. Check its Deployment in descheduler."
  # No target at all: absent() keeps namespace and service.
  - interval: 1m
    input_series:
      - series: 'up{namespace="other",service="other",instance="10.0.0.9:10258"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: DeschedulerDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: descheduler
              service: descheduler-metrics
            exp_annotations:
              summary: "The descheduler is down."
              description: "No replica of the descheduler descheduler/descheduler has answered a scrape for 10 minutes, so pods that break their placement rules or crowd busy nodes stay where they are. Check its Deployment in descheduler."
  # Healthy: it answers.
  - interval: 1m
    input_series:
      - series: 'up{namespace="descheduler",service="descheduler-metrics",instance="10.0.0.1:10258"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: DeschedulerDown
        exp_alerts: []
