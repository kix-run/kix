# promtool unit tests for the external-secrets alert rules
# test-external-secrets.nix renders. The rules-cluster-external-secrets
# check runs them from the rendered rules, so each rule_files entry is
# <namespace>/<file> in the cluster's manifests. The controller's series
# carry the object's own namespace as `exported_namespace`, as a scrape
# renames it. Every rule file loads in every test, so a test that expects
# no alert gives each component healthy series.
rule_files:
  - external-secrets/external-secrets-alerts-prometheusrule.yaml
  - external-secrets/external-secrets-webhook-alerts-prometheusrule.yaml
  - external-secrets/external-secrets-cert-controller-alerts-prometheusrule.yaml
evaluation_interval: 1m
tests:
  # Every component stops answering.
  - interval: 1m
    input_series:
      - series: 'up{namespace="external-secrets",service="external-secrets-metrics",pod="eso-0",instance="10.0.0.1:8080"}'
        values: '1 1 0x15'
      - series: 'up{namespace="external-secrets",service="external-secrets-webhook",pod="eso-webhook-0",instance="10.0.0.2:8080"}'
        values: '1 1 0x15'
      - series: 'up{namespace="external-secrets",service="external-secrets-cert-controller-metrics",pod="eso-cc-0",instance="10.0.0.3:8080"}'
        values: '1 1 0x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: ExternalSecretsControllerDown
        exp_alerts:
          - exp_labels:
              severity: "warning"
              namespace: "external-secrets"
              service: "external-secrets-metrics"
            exp_annotations:
              summary: "The External Secrets controller is down."
              description: "No replica of the controller of External Secrets external-secrets/external-secrets has answered a scrape for 10 minutes. Secrets it already wrote stay in place, but no ExternalSecret is refreshed, so a credential changed in the store does not reach the cluster. Check the Deployment external-secrets in external-secrets."
      - eval_time: 14m
        alertname: ExternalSecretsWebhookDown
        exp_alerts:
          - exp_labels:
              severity: "warning"
              namespace: "external-secrets"
              service: "external-secrets-webhook"
            exp_annotations:
              summary: "The External Secrets webhook is down."
              description: "No replica of the admission webhook of External Secrets external-secrets/external-secrets has answered a scrape for 10 minutes. Its webhook configurations fail closed, so the API server refuses every create and update of an ExternalSecret, SecretStore, or ClusterSecretStore, and deploys that write one fail. Check the Deployment external-secrets-webhook in external-secrets."
      - eval_time: 14m
        alertname: ExternalSecretsCertControllerDown
        exp_alerts:
          - exp_labels:
              severity: "warning"
              namespace: "external-secrets"
              service: "external-secrets-cert-controller-metrics"
            exp_annotations:
              summary: "The External Secrets cert-controller is down."
              description: "No replica of the cert-controller of External Secrets external-secrets/external-secrets has answered a scrape for 10 minutes. The webhook keeps serving with its current certificate, but nothing renews it or writes the CA back into a webhook configuration that lost it, and the API server then refuses ExternalSecret and SecretStore writes. Check the Deployment external-secrets-cert-controller in external-secrets."
  # No component is scraped at all: absent() keeps namespace and service.
  - interval: 1m
    input_series:
      - series: 'up{namespace="other",service="other",pod="other-0",instance="10.0.0.9:8080"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: ExternalSecretsControllerDown
        exp_alerts:
          - exp_labels:
              severity: "warning"
              namespace: "external-secrets"
              service: "external-secrets-metrics"
            exp_annotations:
              summary: "The External Secrets controller is down."
              description: "No replica of the controller of External Secrets external-secrets/external-secrets has answered a scrape for 10 minutes. Secrets it already wrote stay in place, but no ExternalSecret is refreshed, so a credential changed in the store does not reach the cluster. Check the Deployment external-secrets in external-secrets."
      - eval_time: 12m
        alertname: ExternalSecretsWebhookDown
        exp_alerts:
          - exp_labels:
              severity: "warning"
              namespace: "external-secrets"
              service: "external-secrets-webhook"
            exp_annotations:
              summary: "The External Secrets webhook is down."
              description: "No replica of the admission webhook of External Secrets external-secrets/external-secrets has answered a scrape for 10 minutes. Its webhook configurations fail closed, so the API server refuses every create and update of an ExternalSecret, SecretStore, or ClusterSecretStore, and deploys that write one fail. Check the Deployment external-secrets-webhook in external-secrets."
      - eval_time: 12m
        alertname: ExternalSecretsCertControllerDown
        exp_alerts:
          - exp_labels:
              severity: "warning"
              namespace: "external-secrets"
              service: "external-secrets-cert-controller-metrics"
            exp_annotations:
              summary: "The External Secrets cert-controller is down."
              description: "No replica of the cert-controller of External Secrets external-secrets/external-secrets has answered a scrape for 10 minutes. The webhook keeps serving with its current certificate, but nothing renews it or writes the CA back into a webhook configuration that lost it, and the API server then refuses ExternalSecret and SecretStore writes. Check the Deployment external-secrets-cert-controller in external-secrets."
  # Every component answers; every ExternalSecret and store is Ready, and
  # one ExternalSecret was not Ready for less than 15 minutes.
  - interval: 1m
    input_series:
      - series: 'up{namespace="external-secrets",service="external-secrets-metrics",pod="eso-0",instance="10.0.0.1:8080"}'
        values: '1x30'
      - series: 'up{namespace="external-secrets",service="external-secrets-webhook",pod="eso-webhook-0",instance="10.0.0.2:8080"}'
        values: '1x30'
      - series: 'up{namespace="external-secrets",service="external-secrets-cert-controller-metrics",pod="eso-cc-0",instance="10.0.0.3:8080"}'
        values: '1x30'
      - series: 'externalsecret_status_condition{namespace="external-secrets",service="external-secrets-metrics",pod="eso-0",instance="10.0.0.1:8080",exported_namespace="app",name="app-credentials",condition="Ready",status="False"}'
        values: '0x5 1x10 0x14'
      - series: 'externalsecret_status_condition{namespace="external-secrets",service="external-secrets-metrics",pod="eso-0",instance="10.0.0.1:8080",exported_namespace="app",name="app-credentials",condition="Ready",status="True"}'
        values: '1x5 0x10 1x14'
      - series: 'secretstore_status_condition{namespace="external-secrets",service="external-secrets-metrics",pod="eso-0",instance="10.0.0.1:8080",exported_namespace="app",name="fake",condition="Ready",status="False"}'
        values: '0x30'
      - series: 'clustersecretstore_status_condition{namespace="external-secrets",service="external-secrets-metrics",pod="eso-0",instance="10.0.0.1:8080",name="shared",condition="Ready",status="False"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: ExternalSecretsControllerDown
        exp_alerts: []
      - eval_time: 12m
        alertname: ExternalSecretsWebhookDown
        exp_alerts: []
      - eval_time: 12m
        alertname: ExternalSecretsCertControllerDown
        exp_alerts: []
      - eval_time: 30m
        alertname: ExternalSecretNotReady
        exp_alerts: []
      - eval_time: 30m
        alertname: ExternalSecretsSecretStoreNotReady
        exp_alerts: []
      - eval_time: 30m
        alertname: ExternalSecretsClusterSecretStoreNotReady
        exp_alerts: []
  # An ExternalSecret, a SecretStore, and a ClusterSecretStore stay not
  # Ready.
  - interval: 1m
    input_series:
      - series: 'up{namespace="external-secrets",service="external-secrets-metrics",pod="eso-0",instance="10.0.0.1:8080"}'
        values: '1x30'
      - series: 'up{namespace="external-secrets",service="external-secrets-webhook",pod="eso-webhook-0",instance="10.0.0.2:8080"}'
        values: '1x30'
      - series: 'up{namespace="external-secrets",service="external-secrets-cert-controller-metrics",pod="eso-cc-0",instance="10.0.0.3:8080"}'
        values: '1x30'
      - series: 'externalsecret_status_condition{namespace="external-secrets",service="external-secrets-metrics",pod="eso-0",instance="10.0.0.1:8080",exported_namespace="app",name="app-credentials",condition="Ready",status="False"}'
        values: '0 0 1x28'
      - series: 'secretstore_status_condition{namespace="external-secrets",service="external-secrets-metrics",pod="eso-0",instance="10.0.0.1:8080",exported_namespace="app",name="fake",condition="Ready",status="False"}'
        values: '0 0 1x28'
      - series: 'clustersecretstore_status_condition{namespace="external-secrets",service="external-secrets-metrics",pod="eso-0",instance="10.0.0.1:8080",name="shared",condition="Ready",status="False"}'
        values: '0 0 1x28'
    alert_rule_test:
      - eval_time: 20m
        alertname: ExternalSecretNotReady
        exp_alerts:
          - exp_labels:
              severity: "warning"
              namespace: "external-secrets"
              service: "external-secrets-metrics"
              exported_namespace: "app"
              name: "app-credentials"
            exp_annotations:
              summary: "An ExternalSecret fails to sync."
              description: "ExternalSecret app/app-credentials has not been Ready for 15 minutes, so the controller of External Secrets external-secrets/external-secrets could not write its target Secret, which is missing or out of date. Its Ready condition names the error; check kubectl describe externalsecret app-credentials -n app, and whether its store is Ready."
      - eval_time: 20m
        alertname: ExternalSecretsSecretStoreNotReady
        exp_alerts:
          - exp_labels:
              severity: "warning"
              namespace: "external-secrets"
              service: "external-secrets-metrics"
              exported_namespace: "app"
              name: "fake"
            exp_annotations:
              summary: "A SecretStore cannot reach its provider."
              description: "SecretStore app/fake has not been Ready for 15 minutes, so the controller of External Secrets external-secrets/external-secrets cannot sync the ExternalSecrets that use it. The provider refused the store's credentials or did not answer. Its Ready condition names the error; check kubectl describe secretstore fake -n app."
      - eval_time: 20m
        alertname: ExternalSecretsClusterSecretStoreNotReady
        exp_alerts:
          - exp_labels:
              severity: "warning"
              namespace: "external-secrets"
              service: "external-secrets-metrics"
              name: "shared"
            exp_annotations:
              summary: "A ClusterSecretStore cannot reach its provider."
              description: "ClusterSecretStore shared has not been Ready for 15 minutes, so the controller of External Secrets external-secrets/external-secrets cannot sync the ExternalSecrets that use it. The provider refused the store's credentials or did not answer. Its Ready condition names the error; check kubectl describe clustersecretstore shared."
