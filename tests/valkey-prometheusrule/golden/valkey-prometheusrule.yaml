apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/managed-by: kix
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: valkey
  name: valkey
  namespace: default
spec:
  groups:
  - name: valkey
    rules:
    - alert: ValkeyDown
      expr: valkey_up == 0
      for: 5m
      labels:
        severity: critical
