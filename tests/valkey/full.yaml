# Full mode — everything enabled to maximize resource coverage.
# Tests: sentinel + metrics + serviceMonitor + networkPolicy + PDB
# Flake package: valkey-full
#
# Note: Helm's PDB defaults are already create: true for primary/replica,
# and networkPolicy.enabled defaults to true. But in sentinel mode, the PDB
# key is under sentinel scope. We explicitly set everything to be clear.
sentinel:
  enabled: true
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
networkPolicy:
  enabled: true
