apiVersion: v1
kind: Service
metadata:
  annotations:
    kix.monitoring/path: /metrics
    kix.monitoring/port: '9121'
    kix.monitoring/port-name: http-metrics
  labels:
    app.kubernetes.io/component: metrics
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/managed-by: kix
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: valkey
    kix.monitoring/scrape: 'true'
    team: platform
  name: valkey-metrics
  namespace: cache
spec:
  ports:
  - name: http-metrics
    port: 9121
    protocol: TCP
    targetPort: metrics
  selector:
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/name: valkey
  type: ClusterIP
