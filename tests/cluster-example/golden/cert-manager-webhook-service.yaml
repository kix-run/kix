apiVersion: v1
kind: Service
metadata:
  annotations:
    kix.monitoring/path: /metrics
    kix.monitoring/port: '9402'
    kix.monitoring/port-name: metrics
  labels:
    app: webhook
    app.kubernetes.io/component: webhook
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/managed-by: kix
    app.kubernetes.io/name: webhook
    app.kubernetes.io/part-of: kix-example
    kix.monitoring/scrape: 'true'
    team: platform
  name: cert-manager-webhook
  namespace: cert-manager
spec:
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: https
  - name: metrics
    port: 9402
    protocol: TCP
    targetPort: http-metrics
  selector:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/name: webhook
  type: ClusterIP
