apiVersion: v1
kind: Service
metadata:
  annotations:
    kix.monitoring/path: /metrics
    kix.monitoring/port: '9402'
    kix.monitoring/port-name: tcp-prometheus-servicemonitor
  labels:
    app: cert-manager
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/managed-by: kix
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: kix-example
    kix.monitoring/scrape: 'true'
    team: platform
  name: cert-manager
  namespace: cert-manager
spec:
  ports:
  - name: tcp-prometheus-servicemonitor
    port: 9402
    protocol: TCP
    targetPort: http-metrics
  selector:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/name: cert-manager
  type: ClusterIP
