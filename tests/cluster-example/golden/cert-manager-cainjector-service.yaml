apiVersion: v1
kind: Service
metadata:
  annotations:
    kix.monitoring/path: /metrics
    kix.monitoring/port: '9402'
    kix.monitoring/port-name: http-metrics
  labels:
    app: cainjector
    app.kubernetes.io/component: cainjector
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/managed-by: kix
    app.kubernetes.io/name: cainjector
    app.kubernetes.io/part-of: kix-example
    kix.monitoring/scrape: 'true'
    team: platform
  name: cert-manager-cainjector
  namespace: cert-manager
spec:
  ports:
  - name: http-metrics
    port: 9402
    protocol: TCP
  selector:
    app.kubernetes.io/component: cainjector
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/name: cainjector
  type: ClusterIP
