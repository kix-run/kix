repo = "https://github.com/kubernetes-csi/external-snapshotter"

[spegel]
packages = ["experimental.spegel"]
repo = "https://github.com/spegel-org/spegel"

[stackgres-database-postgres]
packages = ["experimental.stackgres-database"]
repo = "https://github.com/postgres/postgres"
tags = '^REL_(\d+_\d+)$'
# The bootstrap Job only runs psql, so it has no reason to change major version.
track = "major"
pinned = { file = "kix/packages/experimental/stackgres-database/default.nix", match = 'tag = "(\d+\.\d+)-alpine"' }

[stackgres-operator]
packages = ["experimental.stackgres-operator"]
repo = "https://gitlab.com/ongresinc/stackgres.git"

[tailscale]
packages = ["experimental.tailscale"]
repo = "https://github.com/tailscale/tailscale"

[tempo]
packages = ["experimental.tempo"]
repo = "https://github.com/grafana/tempo"

[traefik]
packages = ["experimental.traefik"]
repo = "https://github.com/traefik/traefik"

[vaultwarden]
packages = ["experimental.vaultwarden"]
repo = "https://github.com/dani-garcia/vaultwarden"

[vector]
packages = ["experimental.clickhouse-logs", "experimental.loki-logs"]
repo = "https://github.com/vectordotdev/vector"

[velero]
packages = ["experimental.velero"]
repo = "https://github.com/vmware-tanzu/velero"

[volsync]
packages = ["experimental.volsync"]
repo = "https://github.com/backube/volsync"

[zfs-localpv]
packages = ["experimental.zfs-localpv"]
repo = "https://github.com/openebs/zfs-localpv"
