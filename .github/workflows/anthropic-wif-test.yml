# Temporary: checks that workflows on main can reach the Claude API through
# workload identity federation, both with a raw token exchange and through
# the Claude Code CLI. Delete once the bump workflow uses it.
name: anthropic-wif-test
on:
  push:
    branches: [main]
    paths: [.github/workflows/anthropic-wif-test.yml]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  ANTHROPIC_FEDERATION_RULE_ID: fdrl_012Fr9FtgpmcQ7UAF2EqNAHE
  ANTHROPIC_ORGANIZATION_ID: 084c7f85-8473-42ae-a166-c8f6dfcd5570
  ANTHROPIC_SERVICE_ACCOUNT_ID: svac_012BzeTv2wUtTweaAMpJPq8e
  ANTHROPIC_WORKSPACE_ID: wrkspc_01KQt9F2CcKaetf64vS2fP2S
jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "$ANTHROPIC_FEDERATION_RULE_ID",
            "organization_id": "$ANTHROPIC_ORGANIZATION_ID",
            "service_account_id": "$ANTHROPIC_SERVICE_ACCOUNT_ID",
            "workspace_id": "$ANTHROPIC_WORKSPACE_ID"
          }
          JSON

  claude-code:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-jwt
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Fetch GitHub OIDC token
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
      - name: Ask Claude Code one question
        run: claude -p --model haiku "Reply with the single word federated"
