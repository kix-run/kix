name: Changelog

# Every change record under `changes/` must follow the format in
# changes/README.md, on every pull request. A pull request that changes
# `cli/` or `kix/` must also add or change a record, unless it carries the
# `no-changelog` label. A release's CHANGELOG.md section is written from the
# records, so a change with no record is one users never hear about. A pull
# request that adds entries to CHANGELOG.md itself fails, unless it is the
# release pull request that moves the records into `changes/<version>/`.
# Rules: CLAUDE.md § Versioning and breaking changes.
#
# `labeled` and `unlabeled` run the check again when the label changes.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Two pull requests can each pass with the same new id. The run on main
  # catches the pair once both have merged.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    # A Linux VM on the Mac Studio. Its python3 is 3.11 or newer, which the
    # script needs for tomllib (the `version` job in cli-tests.yml relies on
    # the same).
    runs-on: kix-linux-nonix
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Script tests
        run: python3 -m unittest -v change_records.test_change_records
        working-directory: scripts

      - name: Change records
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          if [ -z "$BASE" ]; then
            python3 scripts/change-records.py check
            exit
          fi
          if [ "$NO_CHANGELOG" = true ]; then set -- --no-record-required; fi
          python3 scripts/change-records.py check --base "$BASE" --head "$HEAD" "$@"
