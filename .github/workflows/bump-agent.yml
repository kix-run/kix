name: Bump agent

# Update the version one package pins, with an AI agent doing the package
# change, and open a pull request when the change passes the checks.
#
# The jobs are split by what each one must be trusted with:
#
#   agent    runs Claude Code on text from upstream (release notes, source),
#            which can carry instructions aimed at the agent. It holds no
#            secret and cannot push. It reaches the Claude API through
#            workload identity federation, which accepts only runs on main.
#   verify   applies the agent's commits and runs the checks. It runs code
#            the agent wrote, so it holds no secret either.
#   publish  holds the GitHub App key. It runs nothing from the agent's
#            commits: it checks which files they touch, pushes them, and
#            opens the pull request. The app has no permission to change
#            workflow files.
#
#   escalate when a run with Haiku or Sonnet fails, starts the workflow
#            again with Opus.
#
# The agent job runs on a throwaway Linux VM on the Mac Studio. The verify
# and publish jobs run on isolated Spindle VMs, which have no Google
# identity and no shared cache to reach.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Name used in the branch, report, and change record, such as cert-manager
        required: true
      dirs:
        description: Package folders, separated by spaces, such as kix/packages/stable/cert-manager
        required: true
      pinned:
        description: Version the package pins now, such as 1.2.3
        required: true
      target:
        description: Version to move to, such as 1.3.0
        required: true
      tag:
        description: Upstream release tag of the target, such as v1.3.0
        required: true
      git:
        description: Upstream git repository URL
        required: true
      model:
        description: Model the agent runs. auto picks Opus for a hard bump and Haiku otherwise
        type: choice
        options: [auto, haiku, sonnet, opus]
        default: auto
      extra:
        description: Extra instruction for the agent (optional)
        required: false
        default: ''
      minutes:
        description: Time limit for the agent, in minutes
        required: false
        default: '60'

permissions:
  contents: read

concurrency:
  group: bump-agent-${{ inputs.package }}
  cancel-in-progress: false

env:
  PACKAGE: ${{ inputs.package }}
  DIRS: ${{ inputs.dirs }}
  PINNED: ${{ inputs.pinned }}
  TARGET: ${{ inputs.target }}
  TAG: ${{ inputs.tag }}
  GIT_URL: ${{ inputs.git }}
  MODEL: ${{ inputs.model }}
  EXTRA: ${{ inputs.extra }}
  MINUTES: ${{ inputs.minutes }}
  BRANCH: bump/${{ inputs.package }}-${{ inputs.target }}

jobs:
  agent:
    # A fresh arm64 Linux VM on the Mac Studio for each job, cut off from the
    # local network. Agent runs are long, and this keeps them off the cloud
    # bill and safe from spot preemption. The verify job checks the result
    # again on amd64.
    runs-on: kix-linux-nix
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    outputs:
      base: ${{ steps.base.outputs.sha }}
      outcome: ${{ steps.collect.outputs.outcome }}
      model: ${{ steps.model.outputs.model }}
    env:
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_012Fr9FtgpmcQ7UAF2EqNAHE
      ANTHROPIC_ORGANIZATION_ID: 084c7f85-8473-42ae-a166-c8f6dfcd5570
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_012BzeTv2wUtTweaAMpJPq8e
      ANTHROPIC_WORKSPACE_ID: wrkspc_01KQt9F2CcKaetf64vS2fP2S
      NIX_CONFIG: |
        extra-experimental-features = nix-command flakes pipe-operators
        accept-flake-config = true
    steps:
      - name: Check the inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$PACKAGE" =~ ^[a-z0-9][a-z0-9.-]*$ ]] || fail "package '$PACKAGE' is not a lowercase name"
          for v in "$PINNED" "$TARGET" "$TAG"; do
            [[ "$v" =~ ^[A-Za-z0-9][A-Za-z0-9._+@-]*$ ]] || fail "'$v' is not a version or tag"
          done
          [[ "$GIT_URL" =~ ^https://[A-Za-z0-9.-]+/[A-Za-z0-9._/-]+$ ]] || fail "'$GIT_URL' is not an https git URL"
          [[ "$MINUTES" =~ ^[0-9]+$ && "$MINUTES" -ge 10 && "$MINUTES" -le 120 ]] || fail "minutes must be 10 to 120"
          for d in $DIRS; do
            [[ "$d" =~ ^kix/packages/(stable|experimental)/[a-z0-9-]+$ ]] || fail "'$d' is not a package folder"
          done

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the branch
        id: base
        run: |
          for d in $DIRS; do [ -d "$d" ] || { echo "::error::$d does not exist on main"; exit 1; }; done
          git config user.name "kix-bump agent"
          git config user.email "kix-bump@users.noreply.github.com"
          git switch -c "$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Haiku handles a plain image bump well and stalls on hard ones, so a
      # bump that looks hard gets Opus from the start. The signals: the
      # package vendors CRDs, keeps data, or jumps a major version or more
      # than one minor, or upstream's release notes in between mention a
      # breaking change or a migration.
      - name: Choose the model
        id: model
        run: |
          choose() {
            echo "Model: $1 ($2)"
            echo "model=$1" >> "$GITHUB_OUTPUT"
            echo "MODEL=$1" >> "$GITHUB_ENV"
          }
          if [ "$MODEL" != auto ]; then choose "$MODEL" "chosen when the run started"; exit 0; fi
          read -ra dirs <<<"$DIRS"
          for d in "${dirs[@]}"; do
            if [ -d "$d/crds" ]; then choose opus "$d vendors CRDs"; exit 0; fi
            if grep -rqiE 'volumeClaimTemplates|PersistentVolumeClaim|touches-data|contracts(\.stable|\.experimental)?\.(postgres|mysql|clickhouse|redis|valkey)' "$d"; then
              choose opus "$d keeps data"; exit 0
            fi
          done
          IFS=. read -r old_major old_minor _ <<<"${PINNED#v}"
          IFS=. read -r new_major new_minor _ <<<"${TARGET#v}"
          if [[ "$old_major$old_minor$new_major$new_minor" =~ ^[0-9]+$ ]] \
            && { [ "$new_major" != "$old_major" ] || [ $((new_minor - old_minor)) -gt 1 ]; }; then
            choose opus "$PINNED to $TARGET crosses a major or more than one minor"; exit 0
          fi
          if [[ "$GIT_URL" =~ ^https://github\.com/([^/]+/[^/.]+) ]]; then
            notes=$(curl -sS "https://api.github.com/repos/${BASH_REMATCH[1]}/releases?per_page=50" \
              | jq -r --arg old "${PINNED#v}" --arg new "${TARGET#v}" '
                  def v: ltrimstr("v") | split("-")[0] | split(".") | map(tonumber? // 0);
                  .[] | select(.tag_name | v > ($old | v) and v <= ($new | v)) | .body // ""' 2>/dev/null || true)
            if grep -qiE 'breaking|migration|deprecat|removed' <<<"$notes"; then
              choose opus "upstream's release notes mention a breaking change or a migration"; exit 0
            fi
          fi
          choose haiku "no sign of a hard bump"

      - name: Start Docker
        run: |
          docker info --format '{{.ServerVersion}} {{.Architecture}}' 2>/dev/null \
            || { sudo systemctl start docker.service && docker info --format '{{.ServerVersion}} {{.Architecture}}'; }

      - name: Install Claude Code, kind, kubectl, and Helm
        # Claude Code comes from nixpkgs, which needs the unfree variable.
        # nixpkgs master gets each Claude Code release within a day or so,
        # while the nixpkgs-unstable channel waits for a full Hydra
        # evaluation and runs further behind. The federated sign-in was
        # tested with 2.1.326, so refuse anything older.
        env:
          NIXPKGS_ALLOW_UNFREE: '1'
          MIN_VERSION: 2.1.326
        run: |
          for tool in kind kubectl kubernetes-helm; do
            echo "$(nix build --no-link --print-out-paths "nixpkgs#$tool")/bin" >> "$GITHUB_PATH"
          done
          out=$(nix build --impure --no-link --print-out-paths github:NixOS/nixpkgs/master#claude-code)
          echo "$out/bin" >> "$GITHUB_PATH"
          version=$("$out/bin/claude" --version | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          echo "Claude Code $version"
          if [ "$(printf '%s\n' "$MIN_VERSION" "$version" | sort -V | head -1)" != "$MIN_VERSION" ]; then
            echo "::error::Claude Code $version is older than $MIN_VERSION"
            exit 1
          fi

      - name: Write the brief
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          read -ra dirs <<<"$DIRS"
          export PKG_DIR1="${dirs[0]}" OLD="$PINNED" NAME="$PACKAGE"
          # The backticks and the brief's placeholders are literal text.
          # shellcheck disable=SC2016
          PKG_DIRS=$(printf '`%s` ' "${dirs[@]}")
          export CLUSTER="bump-$PACKAGE" KUBECONFIG="$RUNNER_TEMP/kubeconfig" REPORT="$RUNNER_TEMP/report.md" OUTCOME="$RUNNER_TEMP/outcome"
          CHECK_MORE=""
          for d in "${dirs[@]:1}"; do
            CHECK_MORE+=$'\n\nRun it for each other package folder too, and make each pass: `scripts/check-bump.sh '"$d $PINNED $BASE"'`'
          done
          [ -n "$EXTRA" ] || EXTRA="No extra instructions for this package."
          export PKG_DIRS CHECK_MORE EXTRA
          brief=$(<.github/bump/brief.md)
          for v in PKG_DIRS PKG_DIR1 OLD TARGET TAG GIT_URL EXTRA BRANCH BASE CLUSTER KUBECONFIG REPORT OUTCOME NAME MINUTES CHECK_MORE; do
            brief=${brief//"\${$v}"/${!v}}
          done
          printf '%s\n' "$brief" > "$RUNNER_TEMP/brief.md"
          # shellcheck disable=SC2016
          if grep -n '\${[A-Z_0-9]*}' "$RUNNER_TEMP/brief.md"; then
            echo "::error::the brief has a placeholder with no value"; exit 1
          fi
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"

      - name: Run the agent
        env:
          # Claude Code refuses to skip its permission prompts as root unless
          # told it is in a sandbox, and some runners (Spindle) run jobs as
          # root. The VM is thrown away after the job and holds no secrets.
          IS_SANDBOX: '1'
        run: |
          # Each GitHub identity token lasts about five minutes. Claude Code
          # rereads this file whenever it exchanges it for a new Claude API
          # token, so keep a fresh one in it for the whole run.
          export ANTHROPIC_IDENTITY_TOKEN_FILE="$RUNNER_TEMP/gha-jwt"
          fetch() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.new" \
              && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.new" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch
          ( while sleep 120; do fetch || true; done ) &
          refresher=$!
          set +e
          timeout --kill-after=60 "${MINUTES}m" \
            claude -p --model "$MODEL" --dangerously-skip-permissions \
              --output-format stream-json --verbose \
              < "$RUNNER_TEMP/brief.md" > "$RUNNER_TEMP/transcript.jsonl"
          status=$?
          kill "$refresher"
          echo "Claude Code exited with $status"
          tail -n1 "$RUNNER_TEMP/transcript.jsonl" | jq -r '"cost: $\(.total_cost_usd // "unknown"), turns: \(.num_turns // "unknown")"' || true
          exit "$status"

      - name: Collect the commits and the report
        id: collect
        if: always() && steps.base.outputs.sha
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          git format-patch -q "$BASE..HEAD" -o "$out/patches"
          echo "$(git rev-list --count "$BASE..HEAD") commit(s)"
          cp "$RUNNER_TEMP/brief.md" "$out/"
          [ -f "$RUNNER_TEMP/transcript.jsonl" ] && cp "$RUNNER_TEMP/transcript.jsonl" "$out/"
          if [ -f "$RUNNER_TEMP/report.md" ]; then
            cp "$RUNNER_TEMP/report.md" "$out/report.md"
          else
            echo "The agent wrote no report." > "$out/report.md"
          fi
          tail -n1 "$RUNNER_TEMP/transcript.jsonl" 2>/dev/null \
            | jq '{cost: .total_cost_usd, turns: .num_turns, result: .subtype}' > "$out/usage.json" || echo '{}' > "$out/usage.json"
          cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"
          outcome=$(tr -d '[:space:]' < "$RUNNER_TEMP/outcome" 2>/dev/null || true)
          case "$outcome" in
            upgraded|held|needs-decision|blocked-on-kix) ;;
            *)
              echo "::error::the agent gave no valid outcome (got '$outcome')"
              outcome=invalid
              ;;
          esac
          echo "$outcome" > "$out/outcome"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bump-agent
          path: ${{ runner.temp }}/out
          retention-days: 14

  verify:
    needs: agent
    if: needs.agent.outputs.outcome != 'invalid'
    runs-on: [self-hosted, spindle-4c-8g-50d, access=isolated]
    timeout-minutes: 60
    env:
      BASE: ${{ needs.agent.outputs.base }}
      OUTCOME: ${{ needs.agent.outputs.outcome }}
      NIX_CONFIG: |
        extra-experimental-features = nix-command flakes pipe-operators
        accept-flake-config = true
    steps:
      - name: Checkout the base commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.agent.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bump-agent
          path: ${{ runner.temp }}/in

      - name: Apply the agent's commits
        run: |
          cp .github/bump/check-paths.sh "$RUNNER_TEMP/check-paths.sh"
          shopt -s nullglob
          patches=("$RUNNER_TEMP"/in/patches/*.patch)
          if [ "${#patches[@]}" -eq 0 ]; then
            [ "$OUTCOME" != upgraded ] || { echo "::error::the agent says it upgraded but made no commits"; exit 1; }
            exit 0
          fi
          git config user.name "kix-bump agent"
          git config user.email "kix-bump@users.noreply.github.com"
          git switch -c "$BRANCH"
          git am --keep-cr "${patches[@]}"

      - name: Check which files changed
        run: |
          read -ra dirs <<<"$DIRS"
          "$RUNNER_TEMP/check-paths.sh" "$BASE" "${dirs[@]}"

      # Only an upgrade must be complete. Any other outcome goes to a person
      # with whatever work the agent committed.
      - name: Check the bump is complete
        if: env.OUTCOME == 'upgraded'
        run: |
          fail=0
          read -ra dirs <<<"$DIRS"
          for d in "${dirs[@]}"; do
            scripts/check-bump.sh "$d" "$PINNED" "$BASE" || fail=1
          done
          exit "$fail"

  publish:
    needs: [agent, verify]
    runs-on: [self-hosted, spindle-2c-4g, access=isolated]
    timeout-minutes: 15
    env:
      BASE: ${{ needs.agent.outputs.base }}
      OUTCOME: ${{ needs.agent.outputs.outcome }}
      MODEL: ${{ needs.agent.outputs.model }}
    steps:
      - name: Get a token for the bump app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}

      - name: Checkout the base commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.agent.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bump-agent
          path: ${{ runner.temp }}/in

      - name: Apply the agent's commits and check which files changed
        run: |
          cp .github/bump/check-paths.sh .github/bump/push-signed.py "$RUNNER_TEMP/"
          git config user.name "kix-bump agent"
          git config user.email "kix-bump@users.noreply.github.com"
          git switch -c "$BRANCH"
          shopt -s nullglob
          patches=("$RUNNER_TEMP"/in/patches/*.patch)
          [ "${#patches[@]}" -eq 0 ] || git am --keep-cr "${patches[@]}"
          read -ra dirs <<<"$DIRS"
          "$RUNNER_TEMP/check-paths.sh" "$BASE" "${dirs[@]}"

      # An upgrade opens a normal pull request. Any other outcome needs a
      # person: a draft pull request when the agent committed work, so it is
      # not lost, or an issue when it did not. Both carry the label
      # bump:needs-person.
      - name: Hand the result over
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: 'bump:needs-person'
        run: |
          api() {
            curl -sS --fail-with-body -X "$1" -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$2" --data-binary @-
          }
          cost=$(jq -r '.cost // "unknown"' "$RUNNER_TEMP/in/usage.json")
          commits=$(git rev-list --count "$BASE..HEAD")
          # The report is agent-written text. Break each @ so that no name in
          # it notifies anyone on GitHub.
          report=$(sed 's/@/@\xe2\x80\x8b/g' "$RUNNER_TEMP/in/report.md" | head -c 50000)
          case "$OUTCOME" in
            upgraded)
              title="Update $PACKAGE to $TARGET"
              summary="An agent ($MODEL, \$$cost) wrote this change in [this workflow run]($RUN_URL). The workflow ran \`scripts/check-bump.sh\` on it again and it passed, and every changed file is in a place a version bump may touch. Review it like any other pull request."
              ;;
            held)
              title="Held: $PACKAGE stays below $TARGET"
              summary="An agent ($MODEL, \$$cost) chose not to move to this version, in [this workflow run]($RUN_URL). Its report says why. Close this once you agree, or start the workflow again with other instructions."
              ;;
            needs-decision)
              title="Decide: $PACKAGE $TARGET"
              summary="An agent ($MODEL, \$$cost) stopped at a choice a person must make, in [this workflow run]($RUN_URL). Its report gives the options and a recommendation."
              ;;
            blocked-on-kix)
              title="Blocked on Kix: $PACKAGE $TARGET"
              summary="An agent ($MODEL, \$$cost) found that Kix itself must change before this upgrade, in [this workflow run]($RUN_URL). Its report and housekeeping entry say what."
              ;;
          esac
          {
            echo "\`$PACKAGE\` pins \`$PINNED\`. Upstream's newest release is \`$TARGET\` (tag \`$TAG\`)."
            echo
            echo "$summary"
            echo
            echo "## The agent's report"
            echo
            echo "$report"
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > "$RUNNER_TEMP/body.md"

          if [ "$commits" -gt 0 ]; then
            # Create the commits through the API, so GitHub signs them.
            python3 "$RUNNER_TEMP/push-signed.py" "$GITHUB_REPOSITORY" "$BRANCH" "$BASE"
            draft=false
            [ "$OUTCOME" = upgraded ] || draft=true
            number=$(jq -n --arg title "$title" --arg head "$BRANCH" --argjson draft "$draft" \
                --rawfile body "$RUNNER_TEMP/body.md" \
                '{title: $title, head: $head, base: "main", body: $body, draft: $draft}' \
              | api POST pulls | jq -r '.number')
          elif [ "$OUTCOME" = upgraded ]; then
            echo "::error::the agent says it upgraded but made no commits"
            exit 1
          else
            number=$(jq -n --arg title "$title" --rawfile body "$RUNNER_TEMP/body.md" \
                '{title: $title, body: $body}' | api POST issues | jq -r '.number')
          fi
          echo "Opened $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$number"
          if [ "$OUTCOME" != upgraded ]; then
            jq -n --arg label "$LABEL" '{labels: [$label]}' | api POST "issues/$number/labels" > /dev/null
          fi

  escalate:
    needs: [agent, verify, publish]
    # A failed or stalled run with a smaller model gets one more try with
    # Opus. A run that ended with an outcome other than "upgraded" is not a
    # failure, and a failure while publishing is not the agent's.
    if: >-
      always()
      && needs.agent.outputs.model != 'opus'
      && (needs.agent.result == 'failure'
          || needs.agent.outputs.outcome == 'invalid'
          || needs.verify.result == 'failure')
    runs-on: [self-hosted, spindle-2c-4g, access=isolated]
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the workflow again with Opus
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          workflow=$(basename "${WORKFLOW_REF%@*}")
          jq -n --arg package "$PACKAGE" --arg dirs "$DIRS" --arg pinned "$PINNED" \
              --arg target "$TARGET" --arg tag "$TAG" --arg git "$GIT_URL" --arg extra "$EXTRA" \
            '{ref: "main", inputs: {package: $package, dirs: $dirs, pinned: $pinned, target: $target,
              tag: $tag, git: $git, extra: $extra, model: "opus", minutes: "120"}}' \
            | curl -sS --fail-with-body -X POST -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" --data-binary @-
          echo "Started the workflow again for $PACKAGE $TARGET with Opus."
