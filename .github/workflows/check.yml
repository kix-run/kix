# Hermetic CI — runs all flake checks on every push/PR.
#
# This covers:
# - Schema validation (kubeconform) for all cluster definitions
# - Cross-resource integrity checks (checks.nix)
# - PackageInstance wiring validation (pi-checks.nix)

name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - name: Run all flake checks
        run: nix flake check --print-build-logs
