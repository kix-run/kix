# Hermetic CI — runs all flake checks on every push/PR.
#
# This covers:
# - Schema validation (kubeconform) for all chart variants
# - Golden-file snapshot tests for regression detection
# - Cluster composition assertions (registry, monitoring, negative)
# - Behavioral invariants (managed-by labels, etc.)
# - Cross-resource validation (referential integrity)
#
# Additionally builds all cluster definitions and uploads the rendered
# manifests as artifacts for inspection.

name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - name: Run all flake checks
        run: nix flake check --print-build-logs

      - name: Build cluster manifests
        run: |
          mkdir -p artifacts
          for cluster in cluster-example cluster-full cluster-minimal; do
            outpath=$(nix build ".#${cluster}" --no-link --print-out-paths)
            mkdir -p "artifacts/${cluster}"
            # Sanitize filenames: colons are illegal in GHA artifacts (NTFS compat)
            for f in "$outpath"/*.yaml; do
              safe=$(basename "$f" | tr ':' '_')
              cp "$f" "artifacts/${cluster}/${safe}"
            done
          done

      - name: Upload cluster manifests
        uses: actions/upload-artifact@v4
        with:
          name: cluster-manifests
          path: artifacts/
