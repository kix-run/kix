name: Bundle checks

# The bundle checks too slow for every `cargo test` (cli/README.md,
# "Bundle acceptance checks"):
#
# - each libFuzzer target in cli/fuzz (20s per target on pull requests, two
#   minutes on the weekly schedule and manual runs), seeded from the honest
#   bundles in cli/kix-bundle/tests/fixtures and the plan file in
#   cli/kix/tests/fixtures, under the README's 4 GiB RSS cap;
# - `every_test_cluster_bundles`, which builds and bundles every test
#   cluster;
# - `flake_checks_evaluate_with_helm`, which evaluates every cluster's
#   PackageInstance wiring check and `every-package-evaluates` through kix.
#
# A short run catches a reader change that breaks on the seeds' first
# mutations without holding a Spot VM long enough to be preempted. The weekly
# run is where a slower finding turns up. A crash leaves its input under
# cli/fuzz/artifacts/, uploaded with the run.
#
# Pull requests and the weekly run only. A push to main would repeat the
# pull request's run, and every release pull request runs these checks
# because it changes cli/Cargo.toml and cli/Cargo.lock.
#
# Same Nix setup as cli-tests.yml, on a Spindle VM whose image ships Nix.

on:
  pull_request:
    paths:
      - 'cli/kix-bundle/**'
      - 'cli/kix-container/**'
      - 'cli/kix/src/plan/file.rs'
      - 'cli/kix-core/src/eval/**'
      - 'kix/lib/helm.nix'
      - 'cli/kix-cli/src/commands/bundle.rs'
      - 'cli/kix-cli/tests/commands_test.rs'
      - 'cli/fuzz/**'
      - 'clusters/**'
      - 'flake.nix'
      - 'cli/Cargo.toml'
      - 'cli/Cargo.lock'
      - '.github/workflows/bundle-checks.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-checks:
    runs-on: [self-hosted, spindle-8c-16g]
    timeout-minutes: 60
    env:
      NIX_CONFIG: |
        extra-experimental-features = nix-command flakes pipe-operators
        accept-flake-config = true
        access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      FUZZ_SECONDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '120' || '20' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # cargo-fuzz, zstd, and python3 come from this flake's nixpkgs. The
      # targets build on stable rustc without a sanitizer, hence
      # RUSTC_BOOTSTRAP. `--codegen-units 16` overrides cargo-fuzz's default
      # of 1 so the 8-core runner compiles crates in parallel instead of
      # spending 7+ minutes in single-threaded codegen.
      - name: Fuzz
        run: |
          # The single quotes pass the script to the inner bash unexpanded.
          # shellcheck disable=SC2016
          nix develop --command nix shell --inputs-from . \
            nixpkgs#cargo-fuzz nixpkgs#zstd nixpkgs#python3 --command bash -c '
            set -euo pipefail
            cd cli/fuzz
            ./seed.py ../kix-bundle/tests/fixtures/*.kixbundle ../kix/tests/fixtures/*.kixplan seeds
            export RUSTC_BOOTSTRAP=1
            cargo fuzz build -s none -O --codegen-units 16
            for target in $(cargo fuzz list); do
              case $target in
                *_frames) seeds=seeds/frames ;;
                *) seeds=seeds/raw ;;
              esac
              mkdir -p "corpus/$target"
              cargo fuzz run -s none -O --codegen-units 16 "$target" "corpus/$target" "$seeds" -- \
                -max_total_time="$FUZZ_SECONDS" -max_len=2500000 -rss_limit_mb=4096
            done'

      - name: Every test cluster bundles
        run: |
          nix develop --command bash -c \
            'cd cli && cargo test -p kix-cli --test commands_test -- --ignored every_test_cluster_bundles'

      # Plain `nix flake check` cannot render Helm charts, so the
      # evaluation-only flake checks run through kix here.
      - name: Flake checks evaluate with Helm
        run: |
          nix develop --command bash -c \
            'cd cli && cargo test -p kix-cli --test commands_test -- --ignored flake_checks_evaluate_with_helm'

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: cli/fuzz/artifacts/
          if-no-files-found: ignore
