# Build and test the kix CLI binary.
#
# Jobs:
# - cargo-test: fast unit tests + clippy + fmt (devenv provides Nix C libs)
# - integration-test: full CLI tests with Nix FFI evaluation
# - build: Nix package build + smoke test, Cachix push on main

name: Kix CLI

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'lib/**'
      - 'packages/**'
      - 'clusters/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'devenv.nix'
  pull_request:
    branches: [main]
    paths:
      - 'cli/**'
      - 'lib/**'
      - 'packages/**'
      - 'clusters/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'devenv.nix'

jobs:
  cargo-test:
    name: Unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - uses: cachix/install-devenv-action@v1

      - name: Unit tests
        run: devenv shell -- bash -c 'cd cli && cargo test --workspace --lib'

      - name: Clippy
        run: devenv shell -- bash -c 'cd cli && cargo clippy --workspace --all-targets -- -D warnings'

      - name: Format check
        run: devenv shell -- bash -c 'cd cli && cargo fmt --check'

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - uses: cachix/install-devenv-action@v1

      - name: Integration tests
        run: devenv shell -- bash -c "cd cli && cargo test --workspace --test '*'"

  build:
    name: Build (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - uses: cachix/cachix-action@v15
        with:
          name: kixpkgs
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - uses: cachix/install-devenv-action@v1

      - name: Smoke test
        run: |
          devenv shell -- kix --version
          devenv shell -- kix list
          devenv shell -- kix build example

      - name: Push to Cachix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          nix build .#kix --json | jq -r '.[].outputs.out' | cachix push kixpkgs
