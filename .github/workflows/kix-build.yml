# Build and test the kix CLI binary across platforms.
#
# Builds the Rust CLI with Nix FFI bindings and pushes
# to Cachix on main branch merges.

name: Kix CLI

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'lib/**'
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    branches: [main]
    paths:
      - 'cli/**'
      - 'lib/**'
      - 'flake.nix'
      - 'flake.lock'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - uses: cachix/cachix-action@v15
        with:
          name: kixpkgs
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Build kix CLI
        run: nix build .#kix --print-build-logs

      - name: Smoke test
        run: |
          ./result/bin/kix --version
          ./result/bin/kix list

      - name: Run flake checks
        run: nix flake check --print-build-logs

      - name: Push to Cachix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          nix build .#kix --json | jq -r '.[].outputs.out' | cachix push kixpkgs

  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - name: Run cargo tests in nix develop
        run: |
          nix develop --command bash -c "
            cd cli
            cargo test --workspace
            cargo clippy --workspace -- -D warnings
          "
