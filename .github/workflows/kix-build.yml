# Build and test the kix CLI binary.
#
# Jobs:
# - cargo-test: fast unit tests + clippy + fmt (devenv provides Nix C libs)
# - integration-test: full CLI tests with Nix FFI evaluation
# - build: smoke test on Linux and macOS
#
# Caching:
# - actions/cache: Cargo target dir and registry (keyed by Cargo.lock)
# - actions/cache: kix eval SQLite cache (keyed by flake.lock)

name: Kix CLI

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'lib/**'
      - 'packages/**'
      - 'clusters/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'devenv.nix'
      - 'devenv.lock'
      - 'devenv.yaml'
      - '.github/workflows/kix-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cli/**'
      - 'lib/**'
      - 'packages/**'
      - 'clusters/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'devenv.nix'
      - 'devenv.lock'
      - 'devenv.yaml'
      - '.github/workflows/kix-build.yml'

jobs:
  cargo-test:
    name: Unit tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Unit tests
        run: devenv shell -- bash -c 'cd cli && cargo test --workspace --lib'

      - name: Clippy
        run: devenv shell -- bash -c 'cd cli && cargo clippy --workspace --all-targets -- -D warnings'

      - name: Format check
        run: devenv shell -- bash -c 'cd cli && cargo fmt --check'

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: cargo-integ-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            cargo-integ-${{ runner.os }}-

      - name: Cache kix eval
        uses: actions/cache@v4
        with:
          path: ~/.cache/kix
          key: kix-eval-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            kix-eval-${{ runner.os }}-

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Integration tests
        run: devenv shell -- bash -c "cd cli && cargo test --workspace --test '*'"

  build:
    name: Build (${{ matrix.system }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: cargo-build-${{ matrix.system }}-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            cargo-build-${{ matrix.system }}-

      - name: Cache kix eval
        uses: actions/cache@v4
        with:
          path: ~/.cache/kix
          key: kix-eval-${{ matrix.system }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            kix-eval-${{ matrix.system }}-

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Smoke test
        run: |
          devenv shell -- kix --version
          devenv shell -- kix list
          devenv shell -- kix build example
