name: Private names

# Kix is developed next to private clusters, and their names have slipped
# into examples and pull request text before. This check refuses a pull
# request whose added lines, commit messages, title, or description contain
# a name from a private list, and checks each push to main the same way.
#
# The list is the `PRIVATE_NAMES` secret, one name to a line, so the names
# are not in the repository and GitHub hides them in logs. A pull request
# from a fork cannot read secrets; scripts/private-names then says that
# nothing was checked and passes. The same script runs as a pre-commit hook
# (lefthook.yml) for anyone who keeps the list on their machine.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: private-names-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-names:
    runs-on: [self-hosted, spindle-2c-4g]
    env:
      KIX_PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Changed lines and commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python3 scripts/private-names --base "$BASE"

      - name: Pull request title and description
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | python3 scripts/private-names --stdin "pull request text"
