name: Documentation captures

# Every code block in the docs that shows command output is generated, not
# typed: `nix run ./docs#regen-captures-offline` re-runs each command
# against the example workspace and writes a sidecar under
# docs/src/command-output/. This job fails when a committed sidecar no
# longer matches what the command produces, which is what a compiler change
# that moved the rendered output looks like.
#
# It runs on pull requests so that drift in the docs stops a merge. The
# Pages deploy job only builds the site, so a stale capture never stops
# kix.run from deploying.
#
# A pull request that changes only packages, change records, library tests
# or test clusters does not run it. Package version bumps are such pull
# requests, and they leave the captures alone: the release regenerates every
# capture. Until then, a capture that shows a package's output can be out of
# date, and the next pull request this job checks fails on it.
#
# The fix when this fails is to run
# `nix run ./docs#regen-captures-offline -- --apply` locally and commit
# the result, even when the drift came from a package bump.
#
# The captures need the private kix-run/kix-examples repository, which
# only the KIX_EXAMPLES_TOKEN secret can read. GitHub gives no secrets to a
# pull request from a fork or from Dependabot, so the job skips its steps
# there and says so in a notice.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'kix/**'
      - '!kix/packages/**'
      - '!kix/lib/tests/**'
      - 'clusters/**'
      - '!clusters/test-*'
      - '!clusters/test-*/**'
      - 'cli/**'
      - '.github/workflows/docs-captures.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-captures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  captures:
    runs-on: [self-hosted, spindle-8c-16g-100d]
    env:
      NIX_CONFIG: |
        extra-experimental-features = nix-command flakes pipe-operators
        accept-flake-config = true
        access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check for the kix-examples token
        id: token
        env:
          TOKEN: ${{ secrets.KIX_EXAMPLES_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Documentation captures skipped::This run has no KIX_EXAMPLES_TOKEN secret, which pull requests from forks and from Dependabot never get. The captures need the private kix-examples repository, so they did not run. A maintainer can run this workflow on the branch."
          fi

      - name: Checkout kix
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: kix
          fetch-depth: 0

      # The captures must match the kix-examples revision docs/flake.lock
      # pins, which can be ahead of kix-examples' default branch while a
      # paired kix-examples PR is open.
      - name: Read the pinned kix-examples revision
        if: steps.token.outputs.present == 'true'
        id: examples-rev
        run: echo "rev=$(nix eval --raw --impure --expr '(builtins.fromJSON (builtins.readFile ./kix/docs/flake.lock)).nodes.kix-examples.locked.rev')" >> "$GITHUB_OUTPUT"

      # kix-examples is a separate private repository, which the job's
      # GITHUB_TOKEN cannot read, so it is checked out with its own token
      # and the flake input is overridden to point at it.
      - name: Checkout kix-examples
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: kix-run/kix-examples
          ref: ${{ steps.examples-rev.outputs.rev }}
          token: ${{ secrets.KIX_EXAMPLES_TOKEN }}
          path: kix-examples
          fetch-depth: 0

      - name: Offline captures are fresh
        if: steps.token.outputs.present == 'true'
        working-directory: kix
        run: |
          nix run ./docs#regen-captures-offline \
            --override-input kix-examples "git+file://${{ github.workspace }}/kix-examples" \
            -- --check
