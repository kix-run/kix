name: Deploy site to Cloudflare Pages

# Builds the landing page (Astro site in `web/`) and the Starlight
# docs site (`nix build ./docs#site`), then merges them into one
# directory uploaded to the Cloudflare Pages project `kix-run`:
#
#   kix.run/             ← web/ (Astro build)
#   kix.run/docs/        ← docs at the latest release tag
#   kix.run/docs/main/   ← docs at main
#   kix.run/docs/vX.Y/   ← docs at each older minor release's newest tag
#
# Each version's docs are a separate build at that version's git revision,
# so a release's pages, command output, and code snippets all match it.
# The release job in cli-tests.yml starts this workflow after it tags a
# release; a tag that job pushes starts no workflow by itself.
#
# web/public/ also carries the agent-facing surface, which Astro copies
# into web/dist/ and the staging step merges into the site root:
# robots.txt, llms.txt, 404.html, and _worker.js. Pages runs _worker.js
# as the site Worker (it is not published as an asset); it serves the
# `.md` twin of a docs page to clients sending `Accept: text/markdown`.
# See docs/README.md § Agent-facing surface.
#
# The site also carries what an installed Kix and the install script fetch:
#
#   kix.run/install                       ← web/public/install
#   kix.run/releases/index.json           ← web/scripts/release-index.mjs
#   kix.run/releases/v<version>/SHA256SUMS and SHA256SUMS.sig
#   kix.run/download/<version>/<file>     → redirect by _worker.js
#
# The index lists the releases in kix-run/kix-releases that have a signed
# SHA256SUMS. The release job starts this workflow after it publishes, so a
# run started by the release merge, which fetches before the release exists,
# is followed by one that lists it.
#
# kix-examples is a separate private repository (kix-run/kix-examples) that
# the snippet pipeline reads. CI checks it out with the KIX_EXAMPLES_TOKEN
# secret and overrides the docs flake's input with that checkout, so the
# input itself keeps pointing at a local folder for development.
#
# The site is deployed to Cloudflare Pages by direct upload. It needs two
# repository secrets: CLOUDFLARE_API_TOKEN (scoped to "Cloudflare Pages:
# Edit") and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/**'
      - 'kix/**'
      # kix CLI behaviour affects captured output (the offline
      # regen invokes `kix list clusters` / `kix build` / etc.),
      # so a CLI change can change the captured sidecars even
      # though it doesn't touch docs/ itself.
      - 'cli/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Spindle (runners.example.com) brokers this onto an ephemeral GCE VM
    # running our NixOS CI image. On GitHub the label IS the machine shape:
    # `spindle-auto` is rejected, because GitHub has no per-job claim API
    # and a runner takes whatever queued job matches its labels. 8 vCPU for
    # the landing page and the docs builds; 100 GB because the Nix store
    # holds a docs build per Kix version beside the node_modules trees. See
    # spindle-smoke.yml for the full grammar.
    runs-on: [self-hosted, spindle-8c-16g-100d]
    env:
      # The image ships Nix, so there is no installer step to carry this
      # configuration into /etc/nix/nix.conf. Every `nix` call in the job
      # reads NIX_CONFIG instead.
      #
      # GITHUB_TOKEN lets Nix fetch this repository as a flake input. It
      # cannot read kix-run/kix-examples, which `--override-input
      # kix-examples` below replaces with a checkout.
      #
      # `extra-experimental-features` adds to what /etc/nix/nix.conf
      # enables. The image enables `configurable-impure-env` there for its
      # `impure-env` setting, and Nix refuses to start if a bare
      # `experimental-features` list drops it.
      NIX_CONFIG: |
        extra-experimental-features = nix-command flakes pipe-operators
        accept-flake-config = true
        access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout kix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kix
          # Nix's git fetcher needs the full history to resolve refs/revs
          # cleanly. Default fetch-depth=1 (shallow) breaks things.
          fetch-depth: 0

      # Each release tag's SHA256SUMS and SHA256SUMS.sig, for the release
      # index. A tag whose release is not published yet, or was published
      # without a signature, has no file to fetch and is left out.
      - name: Fetch release sums
        working-directory: kix
        run: |
          base=https://github.com/kix-run/kix-releases/releases/download
          mkdir -p ../releases-src
          for tag in $(git tag -l 'v[0-9]*'); do
            dir="../releases-src/$tag"
            mkdir -p "$dir"
            if curl -fsSL --retry 3 -o "$dir/SHA256SUMS" "$base/$tag/SHA256SUMS" &&
              curl -fsSL --retry 3 -o "$dir/SHA256SUMS.sig" "$base/$tag/SHA256SUMS.sig"; then
              git log -1 --format=%cs "$tag" > "$dir/date"
            else
              echo "$tag has no signed SHA256SUMS in kix-run/kix-releases; the index leaves it out."
              rm -rf "$dir"
            fi
          done

      - name: Checkout kix-examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kix-run/kix-examples
          token: ${{ secrets.KIX_EXAMPLES_TOKEN }}
          path: kix-examples
          fetch-depth: 0

      # The Nix store is NOT cached through actions/cache here.
      # cache-nix-action restores another machine's
      # /nix/var/nix/db over this one's; on NixOS that database does not
      # know about the running system's own closure, so its purge/GC pass
      # is free to collect paths the live system is using. The image's
      # substituters cover the same ground more safely: cache.nixos.org
      # plus the Lithus read-through cache at nix-cache.example.com, both
      # already configured in the image. Only this repository's own
      # derivations rebuild each run.
      # No actions/setup-node step: it downloads an official Node tarball
      # dynamically linked against glibc's loader, which does not exist on
      # NixOS, so every later `node` call would die with "No such file or
      # directory". The image provides Node 24 and npm on PATH instead.
      - name: Build landing page
        working-directory: kix/web
        run: |
          npm ci
          npm run build
          node --test 'scripts/*.test.mjs'
          nix run --inputs-from .. nixpkgs#shellcheck -- public/install scripts/test-install.sh
          # OpenSSL 3, so the install script's signature check runs too.
          nix shell --inputs-from .. nixpkgs#openssl -c sh scripts/test-install.sh

      # Which docs to build: main, the newest release tag, and the newest
      # tag of each older minor release. Prerelease tags, such as
      # v0.8.0-rc.1, get no docs of their own. The release builds are cached
      # by the list of tags, since a tag's docs never change.
      - name: Plan docs builds
        id: docs
        working-directory: kix
        run: |
          releases=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v -- - || true)
          latest=$(head -n1 <<<"$releases")
          archived=""
          seen=" $(cut -d. -f1-2 <<<"$latest") "
          for tag in $releases; do
            minor=$(cut -d. -f1-2 <<<"$tag")
            case "$seen" in *" $minor "*) continue ;; esac
            seen="$seen$minor "
            archived="$archived $tag"
          done
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "archived=${archived# }" >> "$GITHUB_OUTPUT"
          # The key also covers this workflow, which decides how the docs are
          # built, and the files that prepare-release-docs.sh copies into each
          # release. It is hashed here because `hashFiles()` starts a Node 20
          # the Spindle image does not have.
          mapfile -t copied < <(docs/scripts/prepare-release-docs.sh --list)
          workflow=$(cat .github/workflows/pages.yml docs/scripts/prepare-release-docs.sh \
            "${copied[@]}" | sha256sum | cut -c1-16)
          echo "key=docs-releases-$(sha256sum <<<"$latest $archived" | cut -c1-16)-$workflow" >> "$GITHUB_OUTPUT"
          echo "Latest release: ${latest:-none}. Older minor releases: ${archived:-none}."

      - name: Restore release docs
        id: release-docs
        if: steps.docs.outputs.latest != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs-releases
          key: ${{ steps.docs.outputs.key }}

      # Each tag is built against the kix-examples commit its own
      # docs/flake.lock names, so its snippets match it too. Each tag also
      # gets main's theme, so every version looks the same while keeping its
      # own pages, and any snippet its rewritten history lost
      # (docs/scripts/prepare-release-docs.sh).
      - name: Build release docs
        if: steps.docs.outputs.latest != '' && steps.release-docs.outputs.cache-hit != 'true'
        working-directory: kix
        env:
          LATEST: ${{ steps.docs.outputs.latest }}
          ARCHIVED: ${{ steps.docs.outputs.archived }}
        run: |
          build_release_docs() {
            local tag="$1" output="$2" dest="$3"
            git worktree add "../kix-$tag" "$tag"
            docs/scripts/prepare-release-docs.sh "../kix-$tag"
            rev=$(nix run --inputs-from . nixpkgs#jq -- -r '.nodes["kix-examples"].locked.rev' "../kix-$tag/docs/flake.lock")
            git -C ../kix-examples worktree add "../kix-examples-$tag" "$rev"
            nix build "../kix-$tag/docs#$output" \
              --override-input kix-examples "git+file://${{ github.workspace }}/kix-examples-$tag" \
              --out-link "../docs-$tag" \
              --print-build-logs
            mkdir -p "$dest"
            cp -r --no-preserve=mode "../docs-$tag/." "$dest/"
          }
          build_release_docs "$LATEST" site ../docs-releases/latest
          for tag in $ARCHIVED; do
            build_release_docs "$tag" site-archived "../docs-releases/$(cut -d. -f1-2 <<<"$tag")"
          done

      # main is built against the kix-examples checkout above, so in-PR
      # changes there show up. Its own docs/flake.lock is not consulted, and
      # its Kix input follows ours (docs/flake.nix), so there is no
      # second copy to fetch; a lock that resolves one needs git credentials
      # this runner does not have. The captures sidecars are read from the
      # source tree. Before the first release, main is the only version and
      # is built as /docs.
      - name: Build main docs
        working-directory: kix
        env:
          OUTPUT: ${{ steps.docs.outputs.latest != '' && 'site-main' || 'site' }}
        run: |
          nix build "./docs#$OUTPUT" \
            --override-input kix-examples "git+file://${{ github.workspace }}/kix-examples" \
            --print-build-logs \
            --show-trace

      - name: Stage combined artifact
        env:
          LATEST: ${{ steps.docs.outputs.latest }}
          ARCHIVED: ${{ steps.docs.outputs.archived }}
        run: |
          mkdir -p _site
          cp -r kix/web/dist/. _site/
          node kix/web/scripts/release-index.mjs releases-src _site
          mkdir -p _site/docs
          if [ -z "$LATEST" ]; then
            cp -r --no-preserve=mode kix/result/. _site/docs/
            echo '[]' > _site/docs/versions.json
          else
            cp -r docs-releases/latest/. _site/docs/
            mkdir -p _site/docs/main
            cp -r --no-preserve=mode kix/result/. _site/docs/main/
            # The version picker's list (docs/src/components/VersionSelect.astro),
            # newest first. Labels match each build's own.
            minor=$(cut -d. -f1-2 <<<"$LATEST")
            {
              echo "[{\"label\": \"$minor (latest)\", \"path\": \"/docs/\"}"
              echo ", {\"label\": \"main\", \"path\": \"/docs/main/\"}"
              for tag in $ARCHIVED; do
                minor=$(cut -d. -f1-2 <<<"$tag")
                mkdir -p "_site/docs/$minor"
                cp -r "docs-releases/$minor/." "_site/docs/$minor/"
                echo ", {\"label\": \"$minor\", \"path\": \"/docs/$minor/\"}"
              done
              echo "]"
            } > _site/docs/versions.json
            nix run --inputs-from ./kix nixpkgs#jq -- . _site/docs/versions.json
          fi
          # The docs come out of the Nix store read-only; wrangler needs
          # to read every file it uploads.
          chmod -R a+rX _site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main marks this a production deployment, so it
          # serves on the custom domain. A manual run from any other branch
          # deploys a preview at <branch>.kix-run.pages.dev instead, which is
          # how to check the Worker and the release files before they reach
          # kix.run.
          command: pages deploy _site --project-name=kix-run --branch=${{ github.ref == 'refs/heads/main' && 'main' || github.ref_name }}
