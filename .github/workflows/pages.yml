name: Deploy site to Cloudflare Pages

# Builds the landing page (React/Vite app in `web/`) and the Starlight
# docs site (`nix build ./docs#site`), then merges them into one
# directory uploaded to the Cloudflare Pages project `kix-run`:
#
#   kix.run/             ← web/ (Vite build; compiler-H1 hero)
#   kix.run/alt1/        ← web/ at ALT1_REF (pre-refactor variant)
#   kix.run/alt2/        ← web/ at ALT2_REF (get-shit-done hero)
#   kix.run/docs/        ← docs site (current tree)
#   kix.run/docs/v0.1/   ← starlight-versions snapshot
#
# /alt1/ and /alt2/ serve alternate landing pages built from pinned
# refs, for A/B comparison. Vite's --base flag rewrites all asset
# paths, so each build works untouched under its subdirectory. Update
# or remove the ALT*_REF envs on the build step to change/retire them.
#
# kix-examples is a separate private repo (kix-ops/kix-examples) used
# by the snippet pipeline. CI checks it out with a PAT and overrides
# the flake input at build time, so the docs flake's local file://
# input stays untouched for dev workflow.
#
# Deploys go to Cloudflare Pages, not GitHub Pages: kixpkgs is a
# private repo in a Free-plan org, and GitHub Pages only serves
# public repos on that plan. Cloudflare Pages direct upload has no
# such restriction. Needs two repo secrets — CLOUDFLARE_API_TOKEN
# (scoped to "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/**'
      - 'kix/**'
      # kix CLI behaviour affects captured output (the offline
      # regen invokes `kix list clusters` / `kix build` / etc.),
      # so a CLI change can change the captured sidecars even
      # though it doesn't touch docs/ itself.
      - 'cli/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Lets cache-nix-action GC stale caches at the end of the run.
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kixpkgs
        uses: actions/checkout@v6
        with:
          path: kixpkgs
          # Nix's git fetcher needs the full history to resolve refs/revs
          # cleanly. Default fetch-depth=1 (shallow) breaks things.
          fetch-depth: 0

      - name: Checkout kix-examples
        uses: actions/checkout@v6
        with:
          repository: kix-ops/kix-examples
          token: ${{ secrets.KIX_EXAMPLES_TOKEN }}
          path: kix-examples
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            # Let Nix fetch private github inputs. GITHUB_TOKEN is
            # auto-issued for this workflow and has read access to
            # adamcharnock/kixpkgs (this repo). It is sufficient
            # ONLY because `--override-input kix-examples` below
            # bypasses the one fetch this token couldn't cover
            # (kix-ops/kix-examples is a different org). If
            # kix-examples ever grows a private input that escapes
            # the override, swap in an org-wide PAT.
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # Cache /nix/store across runs so subsequent builds skip the
      # ~10 min cold-build (Node toolchain, npm deps, Astro build).
      # See https://github.com/nix-community/cache-nix-action
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # Hash only files that actually affect the closure the
          # cache restores: flake/npm locks, the kix Rust workspace
          # lock (cargo crate derivation hashes), and the pieces of
          # docs/nix/ that contribute generator outputs the site
          # copies in (snippets/reference). Captures-pipeline edits
          # in docs/nix/captures*.nix don't enter the cache-relevant
          # closure for the cargo crates, so they're omitted.
          primary-key: nix-${{ runner.os }}-${{ hashFiles('docs/flake.lock', 'docs/package-lock.json', 'cli/Cargo.lock', 'docs/nix/snippets.nix', 'docs/nix/reference.nix', 'kix/packages/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Trim the cached store before saving — keeps the cache under
          # GitHub's 10 GB-per-repo cap and avoids paying upload time
          # for paths the next run can't use.
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Check offline captures are fresh
        working-directory: kixpkgs
        run: |
          # Re-runs every offline capture against the workspace and
          # diffs against the committed sidecars under
          # docs/src/command-output/. Exits non-zero on any drift —
          # the fix is to run `nix run ./docs#regen-captures-offline
          # -- --apply` locally and commit the result.
          nix run ./docs#regen-captures-offline \
            --override-input kix-examples "git+file://${{ github.workspace }}/kix-examples" \
            -- --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kixpkgs/web/package-lock.json

      - name: Build landing page
        working-directory: kixpkgs/web
        run: |
          npm ci
          npm run build

      - name: Build alternate landing pages (served at /alt1/, /alt2/)
        working-directory: kixpkgs
        env:
          # alt1: pre-refactor landing page ("Kubernetes any developer
          # can run." hero), branch variant/pre-refactor.
          ALT1_REF: 474e728d7e292092f22e68a9a519218ebb657ee8
          # alt2: the previous root site ("Getting shit done with
          # Kubernetes." hero). The compiler-H1 hero that used to live
          # here was promoted to the root `web/`; this pins the old
          # root for comparison.
          ALT2_REF: 0c128cd0a15a7d3a494326570b3ad0e82c25f871
        run: |
          build_alt() {
            local name="$1" ref="$2"
            git worktree add "../web-$name" "$ref"
            (cd "../web-$name/web" && npm ci && npx vite build --base="/$name/")
          }
          build_alt alt1 "$ALT1_REF"
          build_alt alt2 "$ALT2_REF"

      - name: Build docs site
        working-directory: kixpkgs
        run: |
          # Override kix-examples to the local checkout so we pick up
          # uncommitted/in-PR changes. Its kixpkgs input resolves via
          # the GitHub fetcher (using the access-tokens config on the
          # Nix installer step). The captures sidecars are read from
          # the source tree (already gated by the check step above).
          nix build ./docs#site \
            --override-input kix-examples "git+file://${{ github.workspace }}/kix-examples" \
            --print-build-logs \
            --show-trace

      - name: Stage combined artifact
        run: |
          mkdir -p _site
          cp -r kixpkgs/web/dist/. _site/
          mkdir -p _site/alt1 _site/alt2
          cp -r web-alt1/web/dist/. _site/alt1/
          cp -r web-alt2/web/dist/. _site/alt2/
          # /alt/ briefly served the pre-refactor variant; redirect it.
          mkdir -p _site/alt
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=/alt1/">' > _site/alt/index.html
          mkdir -p _site/docs
          cp -r --no-preserve=mode kixpkgs/result/. _site/docs/
          # The docs come out of the Nix store read-only; wrangler needs
          # to read every file it uploads.
          chmod -R a+rX _site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main marks this a production deployment, so it
          # serves on the custom domain rather than a preview URL.
          command: pages deploy _site --project-name=kix-run --branch=main
