name: Deploy site to GitHub Pages

# Builds the homepage (static HTML in `homepage/`) and the Starlight
# docs site (`nix build ./docs#site`), then merges them into one
# Pages artifact:
#
#   kixops.dev/             ← homepage/
#   kixops.dev/docs/        ← docs site (current tree)
#   kixops.dev/docs/v0.1/   ← starlight-versions snapshot
#
# kix-examples is a separate private repo (kix-ops/kix-examples) used
# by the snippet pipeline. CI checks it out with a PAT and overrides
# the flake input at build time, so the docs flake's local file://
# input stays untouched for dev workflow.

on:
  push:
    branches: [main]
    paths:
      - 'homepage/**'
      - 'docs/**'
      - 'kix/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kixpkgs
        uses: actions/checkout@v4
        with:
          path: kixpkgs
          # Nix's git fetcher needs the full history to resolve refs/revs
          # cleanly. Default fetch-depth=1 (shallow) breaks things.
          fetch-depth: 0

      - name: Checkout kix-examples
        uses: actions/checkout@v4
        with:
          repository: kix-ops/kix-examples
          token: ${{ secrets.KIX_EXAMPLES_TOKEN }}
          path: kix-examples
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true

      # Cache /nix/store across runs so subsequent builds skip the
      # ~10 min cold-build (Node toolchain, npm deps, Astro build).
      # See https://github.com/nix-community/cache-nix-action
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('docs/flake.lock', 'docs/package-lock.json', 'docs/flake.nix', 'docs/nix/**', 'kix/packages/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Trim the cached store before saving — keeps the cache under
          # GitHub's 10 GB-per-repo cap and avoids paying upload time
          # for paths the next run can't use.
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build docs site
        working-directory: kixpkgs
        run: |
          # kix-examples is a flake that itself has a `kixpkgs` input
          # locked to a local file:// path on the maintainer's machine.
          # Override both: the docs' direct input AND kix-examples'
          # transitive kixpkgs input, pointing them at the runner's
          # checkouts.
          nix build ./docs#site \
            --override-input kix-examples "git+file://${{ github.workspace }}/kix-examples" \
            --override-input kix-examples/kixpkgs "git+file://${{ github.workspace }}/kixpkgs" \
            --print-build-logs \
            --show-trace

      - name: Stage combined artifact
        run: |
          mkdir -p _site
          cp -r kixpkgs/homepage/. _site/
          mkdir -p _site/docs
          cp -r --no-preserve=mode kixpkgs/result/. _site/docs/
          # Pages artifacts must be world-readable.
          chmod -R a+rX _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - id: deployment
        uses: actions/deploy-pages@v4
