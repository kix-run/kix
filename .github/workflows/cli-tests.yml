name: CLI tests

# Runs the CLI's `cargo test` suite, formatting, clippy, and a security
# audit of its dependencies on every pull request that can change what the
# CLI does or prints. On main, the same workflow also builds, signs, and
# publishes a release when cli/Cargo.toml names a version with no tag yet.
#
# The tests cannot run inside a Nix build: the crane package sets
# `doCheck = false` because the integration tests need a writable Nix store
# for the eval cache and the build sandbox has none. So this runs them from
# the flake's devShell instead, which carries the Rust toolchain.
#
# Spindle (runners.example.com) brokers this onto an ephemeral GCE VM whose
# image ships Nix; see .github/workflows/spindle-smoke.yml for the runner
# and the `runs-on` label grammar.

on:
  pull_request:
    paths:
      - 'cli/**'
      # The snapshot tests build a cluster, so a change to the compiler or
      # to a package changes their expected output.
      - 'kix/**'
      - 'clusters/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/cli-tests.yml'
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'kix/**'
      - 'clusters/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/cli-tests.yml'
  workflow_dispatch:
    inputs:
      rehearse:
        description: >-
          Rehearse a release: build the archives as this version (X.Y.Z or a
          prerelease such as X.Y.Z-rc.N, not a released one), sign them with
          the release key, and install them from a copy of the release site.
          Publishes nothing.
        required: false
        default: ''

permissions:
  contents: read

# A run on main is never cancelled once it starts, so a push that lands
# during a release cannot stop it between publishing and tagging. A newer
# push can still replace a main run that is waiting to start; the newer run
# then makes the release, from its own commit.
concurrency:
  group: cli-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: [self-hosted, spindle-8c-16g]
    # A normal run takes under 10 minutes. Without a limit, a hung runner
    # holds a release until someone notices.
    timeout-minutes: 30
    env:
      # The image ships Nix, so there is no installer step to carry this
      # into /etc/nix/nix.conf. `extra-` matters: the bare
      # `experimental-features` REPLACES what the image enabled, which
      # breaks `configurable-impure-env`. Same form as pages.yml.
      NIX_CONFIG: |
        extra-experimental-features = nix-command flakes pipe-operators
        accept-flake-config = true
        access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nix's git fetcher needs the full history to resolve refs
          # cleanly; the default shallow clone breaks it.
          fetch-depth: 0

      # `cargo-fmt` and `cargo-clippy`, not `cargo fmt` and `cargo clippy`.
      # Cargo looks a subcommand up next to its own binary and in
      # $CARGO_HOME/bin before it looks at PATH, so on any machine with
      # rustup installed those two forms find rustup's shims instead of the
      # toolchain this shell provides, and fail with "rustup could not
      # choose a version". Naming the binary keeps the command honest here
      # and on a contributor's laptop.
      - name: Formatting
        run: nix develop --command bash -c 'cd cli && cargo-fmt --check'

      - name: Clippy
        run: |
          nix develop --command bash -c \
            'cd cli && cargo-clippy --workspace --all-targets -- -D warnings'

      # Includes the four output snapshots under
      # cli/kix-cli/tests/snapshots/. They capture whole rendered manifests,
      # identity hashes included, so a deliberate change to what the
      # compiler emits fails this step. That is the point: refresh them with
      # `INSTA_UPDATE=always cargo test -p kix-cli --test snapshot_test` and
      # commit the result in the same change that moved the output.
      - name: Tests
        run: nix develop --command bash -c 'cd cli && cargo test --workspace'

      # Fails when a dependency in cli/Cargo.lock has a published security
      # advisory (RustSec). Advisories about unmaintained or unsound crates
      # are printed as warnings and do not fail the job. The advisory
      # database is fetched fresh on each run, so a new advisory can fail a
      # branch that passed yesterday.
      - name: Security advisories
        run: |
          nix shell --inputs-from . nixpkgs#cargo-audit \
            --command cargo-audit audit --file cli/Cargo.lock

      # Evaluating the runtime spec runs the checks in cli/runtime/runtime.nix:
      # that programs.json, which kix compiles in, matches what the runtime
      # ships, and that every licence is on the approved list. Evaluation
      # downloads nothing, so this covers every target from one machine. The
      # release builds the runtime itself.
      - name: Runtime checks
        run: |
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            nix eval --raw ".#packages.$system.kix-runtime-spec.drvPath" >/dev/null
          done

  # Decides whether this run is a release, from the workspace version in
  # cli/Cargo.toml: it is when this repository has no `v<version>` tag yet.
  # A version lower than the latest tag, or one with no CHANGELOG.md
  # section, fails here, before anything is built. cli/README.md § Releases
  # has the whole process.
  #
  # It also decides whether the archive jobs run (`build`). They run for a
  # release push, for workflow_dispatch, and for a pull request that changes
  # how kix runs Nix or Helm without a Nix install. Only `publish` makes a
  # release public, and only for a push to main.
  version:
    # A Linux VM on the Mac Studio. It boots in seconds and has python3 but
    # no Rust, so the version comes from cli/Cargo.toml directly.
    runs-on: kix-linux-nonix
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      notes: ${{ steps.version.outputs.notes }}
      build: ${{ steps.build.outputs.build }}
      runtime: ${{ steps.build.outputs.runtime }}
      rehearse: ${{ steps.version.outputs.rehearse }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Reads the release tags.
          fetch-depth: 0

      - name: Version
        id: version
        env:
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          # A version with a `-` suffix, such as 0.8.0-rc.1, is a prerelease.
          version_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          # Sort versions oldest first, with a prerelease before its release.
          # sort -V puts `~` before the end of the text, as semver puts a
          # prerelease before its release.
          semver_sort() { sed 's/-/~/' | sort -V | sed 's/~/-/'; }

          # A rehearsal builds the archives as the version it names, so the
          # release index lists them like a release.
          if [ -n "$REHEARSE" ]; then
            if ! printf '%s\n' "$REHEARSE" | grep -Eq "$version_re"; then
              echo "rehearse must be a version such as 0.0.1 or 0.0.1-rc.1, not '$REHEARSE'."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$REHEARSE" >/dev/null; then
              echo "v$REHEARSE is a released version. Rehearse with one that is not, such as 0.0.1."
              exit 1
            fi
            {
              echo "version=$REHEARSE"
              echo "release=false"
              echo "rehearse=true"
              case $REHEARSE in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base=$(python3 -c 'import tomllib; print(tomllib.load(open("cli/Cargo.toml", "rb"))["workspace"]["package"]["version"])')

          if git rev-parse -q --verify "refs/tags/v$base" >/dev/null; then
            echo "version=${base}+${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! printf '%s\n' "$base" | grep -Eq "$version_re"; then
            echo "cli/Cargo.toml has version $base, which is not X.Y.Z or a prerelease such as X.Y.Z-rc.N."
            exit 1
          fi
          latest=$(git tag -l 'v[0-9]*' | sed 's/^v//' | semver_sort | tail -n1)
          if [ -n "$latest" ] && [ "$(printf '%s\n' "$latest" "$base" | semver_sort | tail -n1)" != "$base" ]; then
            echo "cli/Cargo.toml has version $base, lower than the latest release tag v$latest."
            exit 1
          fi

          # The release notes: this version's CHANGELOG.md section, without
          # its heading. A prerelease has no section of its own, so its notes
          # are written from the unreleased change records in changes/, which
          # its release will take.
          case $base in
            *-*)
              prerelease=true
              # The backticks are Markdown for the release page.
              # shellcheck disable=SC2016
              printf 'Prerelease of Kix %s. Install it by name: `kix self install %s`, or `curl -fsSL https://kix.run/install | KIX_VERSION=%s sh`.\n\n' \
                "${base%%-*}" "$base" "$base" > release-notes.md
              python3 scripts/change-records.py changelog >> release-notes.md
              missing="changes/ has no unreleased change records."
              ;;
            *)
              prerelease=false
              # A record merged after the release pull request moved the
              # others would ship in this release and be listed in the next.
              if [ ! -d "changes/$base" ] || [ "$(python3 scripts/change-records.py bump)" != none ]; then
                echo "changes/$base/ is missing, or changes/ still holds unreleased records."
                echo "Move them with: scripts/change-records.py release $base (the release skill)."
                exit 1
              fi
              : > release-notes.md
              awk -v v="$base" '$1 == "##" && $2 == v { on = 1; next } on && /^## / { exit } on' \
                CHANGELOG.md >> release-notes.md
              missing="CHANGELOG.md has no '## $base' section, or it lists no changes. The release skill writes it."
              ;;
          esac
          if ! grep -q '^[-*] ' release-notes.md; then
            echo "$missing"
            exit 1
          fi
          printf '\nBuilt from kix-run/kix@%s.\n' "$GITHUB_SHA" >> release-notes.md

          {
            echo "version=$base"
            echo "release=true"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          {
            echo 'notes<<KIX_RELEASE_NOTES_END'
            cat release-notes.md
            echo 'KIX_RELEASE_NOTES_END'
          } >> "$GITHUB_OUTPUT"

      # `build` runs the whole archive pipeline: the release binaries, and
      # the archives run without Nix and with the machine's Nix. It runs for
      # a release, for a pull request that makes one (its version has no
      # tag yet), and for workflow_dispatch. Building the release binaries
      # takes about ten minutes, so other pull requests skip it.
      #
      # `runtime` builds only the runtime for each platform and checks its
      # programs run. A pull request runs it when it changes the runtime,
      # the code that evaluates a cluster and renders its Helm charts, or
      # the Nix side of those renders. To run the whole pipeline on such a
      # pull request: `gh workflow run cli-tests.yml --ref <branch>`.
      - name: Build the archives?
        id: build
        env:
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ steps.version.outputs.release }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          build=false
          runtime=false
          case $EVENT in
            workflow_dispatch) build=true ;;
            push | pull_request) build=$RELEASE ;;
          esac
          runtime=$build
          if [ "$EVENT" = pull_request ] && git diff --name-only "$BASE_SHA...HEAD" | grep -Eq \
            '^(cli/runtime/|cli/kix-core/runtime/|cli/kix-core/src/eval/|kix/lib/helm\.nix$|kix/lib/helm-versions\.json$|\.github/workflows/cli-tests\.yml$)'; then
            runtime=true
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"
          echo "runtime=$runtime" | tee -a "$GITHUB_OUTPUT"

  # Builds the runtime a release ships beside the binary, in libexec/kix/
  # (cli/runtime/), on a runner of each target platform: Nix fetches the
  # programs for its own platform, and the macOS bundle step needs macOS to
  # rewrite and sign the libraries. The macOS job also builds kix for
  # aarch64-apple-darwin, which cargo zigbuild cannot link. Each job uploads
  # tar files, because workflow artifacts drop file modes and symbolic
  # links.
  runtime:
    # Runs alongside `test`. Nothing here depends on the tests, and
    # `publish` still waits for them through `release`.
    needs: [version]
    if: needs.version.outputs.runtime == 'true'
    strategy:
      # Each platform's result is worth seeing, even when another fails.
      fail-fast: false
      matrix:
        include:
          # Spindle's image ships Nix.
          - system: x86_64-linux
            runner: [self-hosted, spindle-8c-16g]
          # A Linux VM on the Mac Studio, with Nix installed.
          - system: aarch64-linux
            runner: kix-linux-nix
          # The Mac Studio's self-hosted runner: a fresh macOS VM for each
          # job, with Nix installed.
          - system: aarch64-darwin
            runner: kix-macos-nix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # macOS tar would otherwise store extended attributes as ._ files, which
    # the Linux release job would unpack into the archive.
    env:
      COPYFILE_DISABLE: '1'
      # For the Nix that the Spindle and Mac Studio images ship. `extra-`
      # keeps what the image enabled.
      NIX_CONFIG: |
        extra-experimental-features = nix-command flakes pipe-operators
        access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The Mac image ships a damaged ~/.cache/nix (its fetcher cache
      # database is malformed). Nix rebuilds the cache when it is missing.
      - name: Clear the Mac image's Nix cache
        if: runner.os == 'macOS'
        run: rm -rf ~/.cache/nix

      # assemble.py prints each program it ships. On macOS it also relocates
      # the nix build's libraries and fails on any library that runtime.nix
      # does not list, so THIRD_PARTY_LICENSES covers everything shipped.
      - name: Build the runtime
        run: |
          spec=$(nix build ".#packages.${{ matrix.system }}.kix-runtime-spec" --no-link --print-out-paths)
          # Spindle's image has no python3 of its own.
          py() { nix shell --inputs-from . nixpkgs#python3 --command python3 "$@"; }
          py cli/runtime/assemble.py "$spec" runtime/libexec/kix
          tar -cf "runtime-${{ matrix.system }}.tar" -C runtime libexec
          # Writable copies, so the release job can unpack the sources of
          # every platform into one directory, over each other.
          cp -R "$(py -c 'import json, sys; print(json.load(open(sys.argv[1]))["sources"])' "$spec")" sources
          chmod -R u+w sources
          tar -cf "sources-${{ matrix.system }}.tar" -C sources .

      - name: Check the bundled programs run
        run: |
          r=runtime/libexec/kix
          for helm in "$r"/helm-*/bin/helm; do "$helm" version --short; done
          for nix in "$r"/nix-*/bin/nix "$r"/nix-*/bin/nix-store; do "$nix" --version; done
          for kubectl in "$r"/kubectl-*/bin/kubectl; do "$kubectl" version --client; done
          for sops in "$r"/sops-*/bin/sops; do "$sops" --version --disable-version-check; done

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        if: runner.os == 'macOS'
        with:
          toolchain: stable

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        if: runner.os == 'macOS'
        with:
          tool: cargo-auditable@0.7.2

      # `cargo auditable` embeds the crate list in the binary (see the
      # release job).
      - name: Build kix for macOS
        if: runner.os == 'macOS'
        env:
          KIX_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo auditable build --manifest-path cli/Cargo.toml --locked --release -p kix-cli
          bin=cli/target/release/kix
          test "$("$bin" --version)" = "kix $KIX_VERSION" || { "$bin" --version; exit 1; }
          tar -cf kix-aarch64-darwin.tar -C cli/target/release kix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.system }}
          path: |
            runtime-${{ matrix.system }}.tar
            sources-${{ matrix.system }}.tar
            kix-aarch64-darwin.tar
          if-no-files-found: error

  # Builds the Linux kix binaries for a release. It needs only `version`,
  # so it runs alongside `test` and `runtime`. The macOS binary is built by
  # the macOS `runtime` job. Pushes to main that are not releases build
  # nothing.
  build:
    needs: [version]
    if: needs.version.outputs.build == 'true'
    # A Linux VM on the Mac Studio (arm64 Ubuntu), not Spindle. The binaries
    # are static musl, and nixpkgs has no musl standard library for its
    # rustc in the binary cache, while rustup's toolchains do not run on
    # Spindle's NixOS image.
    runs-on: kix-linux-nonix
    timeout-minutes: 45
    env:
      TARGETS: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      # cargo-zigbuild uses zig as the C compiler and linker, which builds
      # ring and the bundled SQLite for both architectures from one runner.
      # Release builds start clean, so saving zig's cache only costs time.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
          use-cache: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-zigbuild,cargo-auditable@0.7.2

      # kix::VERSION reads KIX_VERSION at compile time, so `kix --version`,
      # plan documents and compliance receipts carry the version.
      # `cargo auditable` embeds the list of crates and versions in each
      # binary, so `cargo audit bin`, syft, trivy, or grype can read what a
      # released kix contains without its source.
      - name: Build
        env:
          KIX_VERSION: ${{ needs.version.outputs.version }}
        run: |
          for target in $TARGETS; do
            cargo auditable zigbuild --manifest-path cli/Cargo.toml --locked --release \
              -p kix-cli --target "$target"
          done
          # tar keeps the executable bit, which upload-artifact drops.
          tar -cf kix-linux.tar -C cli/target \
            x86_64-unknown-linux-musl/release/kix aarch64-unknown-linux-musl/release/kix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kix-linux
          path: kix-linux.tar
          if-no-files-found: error

  # Packs each platform's kix binary with its runtime into one archive per
  # platform, once the tests pass. The `publish` job publishes the archives
  # once `without-nix` and `nix-builder` have run them.
  #
  # A workflow_dispatch run builds and uploads the archives as a workflow
  # artifact but publishes nothing, which is how to try a change to these
  # jobs from a branch: `gh workflow run cli-tests.yml --ref <branch>`.
  release:
    needs: [test, version, runtime, build]
    if: needs.version.outputs.build == 'true'
    runs-on: kix-linux-nonix
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The change records and scripts/change-records.py, kept apart from
      # the packaging folders below.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src

      # `cargo audit` reads each binary's crate list and needs cargo to run.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit@0.22.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: runtime
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kix-linux

      # Each archive holds kix-<version>-<system>/bin/kix beside
      # libexec/kix/, where kix looks for its runtime. Asset names carry no
      # version, so releases/latest/download/kix-<arch>-<os>.tar.gz always
      # resolves.
      - name: Package
        run: |
          # The binary for this runner's architecture is the one that runs here.
          host=$(uname -m)
          mkdir linux
          tar -xf kix-linux.tar -C linux
          bin=linux/$host-unknown-linux-musl/release/kix
          file "$bin" | grep -Eq 'statically linked|static-pie linked' || { file "$bin"; exit 1; }
          test "$("$bin" --version)" = "kix $VERSION" || { "$bin" --version; exit 1; }

          mkdir dist darwin
          tar -xf runtime/kix-aarch64-darwin.tar -C darwin
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            case $system in
              *-linux) kix="linux/${system%%-*}-unknown-linux-musl/release/kix" ;;
              *-darwin) kix=darwin/kix ;;
            esac
            dir="kix-$VERSION-$system"
            mkdir -p "pkg/$dir/bin"
            install -m 755 "$kix" "pkg/$dir/bin/kix"

            # The RustSec report for the crates built into this binary, read
            # from the binary itself. It ships in the archive and as a release
            # asset. A binary without the embedded crate list, or with a known
            # vulnerability, stops the release.
            report="dist/kix-$VERSION-$system-cargo-audit.json"
            status=0
            cargo audit --json bin "$kix" > "$report" || status=$?
            jq -r '"\(.lockfile["dependency-count"]) crates, \(.vulnerabilities.count) vulnerabilities, " + ([.warnings[] | length] | add // 0 | tostring) + " warnings"' "$report"
            if [ "$(jq '.lockfile["dependency-count"]' "$report")" -lt 100 ]; then
              echo "$kix carries no embedded crate list; build it with cargo auditable" >&2
              exit 1
            fi
            if [ "$status" -ne 0 ]; then
              cargo audit bin "$kix" || true
              exit "$status"
            fi
            install -Dm 644 "$report" "pkg/$dir/share/kix/cargo-audit.json"
            tar -xf "runtime/runtime-$system.tar" -C "pkg/$dir"
            tar -czf "dist/kix-$system.tar.gz" -C pkg "$dir"
          done

          # This architecture's Linux archive runs here: kix must find the
          # runtime beside it and every file must match the manifest.
          "pkg/kix-$VERSION-$host-linux/bin/kix" doctor

          # One archive with the LGPL sources of every platform. A source
          # that two platforms share lands once.
          sources="kix-$VERSION-third-party-sources"
          mkdir "$sources"
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            tar -xf "runtime/sources-$system.tar" -C "$sources"
          done
          tar -I 'zstd -19 -T0' -cf "dist/$sources.tar.zst" "$sources"

          # The change records of this release, for `kix upgrade` and other
          # tools. changes/README.md has the format.
          python3 src/scripts/change-records.py json --version "$VERSION" > "dist/kix-$VERSION-changes.json"

          (cd dist && sha256sum -- *.tar.gz *.tar.zst *.json > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kix-${{ needs.version.outputs.version }}
          path: dist/

  # Runs each release archive on a machine with no Nix, where kix must work
  # from its own runtime and store: `kix doctor`, then `kix build` of a
  # cluster without Helm and of one with Helm, which fetches nixpkgs and
  # renders a chart. On Linux a plain Ubuntu container holds no /nix. On
  # macOS sandbox-exec denies every access to /nix
  # (cli/runtime/without-nix.sh).
  without-nix:
    needs: [version, release]
    if: needs.version.outputs.build == 'true'
    strategy:
      matrix:
        include:
          # Spindle's image has Nix. without-nix.sh runs Kix in a plain
          # Ubuntu container, which has no /nix, and checks that.
          - system: x86_64-linux
            runner: [self-hosted, spindle-4c-8g]
          # Linux and macOS VMs on the Mac Studio, with no Nix in the image.
          - system: aarch64-linux
            runner: kix-linux-nonix
          - system: aarch64-darwin
            runner: kix-macos-nonix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NIX_CONFIG: |
        access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    steps:
      # A clone, not a worktree, with the full history that Nix's git
      # fetcher needs.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kix-${{ needs.version.outputs.version }}
          path: dist

      # A rehearsal builds Kix as a version the library does not report,
      # and Kix refuses a library from a newer patch or another minor. So
      # the rehearsal gives the library its version too. The commit is
      # local, so Nix's git fetcher sees it.
      - name: Give the library the rehearsal's version
        if: needs.version.outputs.rehearse == 'true'
        run: |
          sed -i.bak "/^\[workspace.package\]/,/^\[/ s/^version = .*/version = \"$VERSION\"/" cli/Cargo.toml
          rm cli/Cargo.toml.bak
          grep -qx "version = \"$VERSION\"" cli/Cargo.toml
          git -c user.name=rehearsal -c user.email=rehearsal@localhost commit -q -am "Rehearse $VERSION"

      - name: Run the archive without Nix
        run: |
          tar -xzf "dist/kix-${{ matrix.system }}.tar.gz" -C "$RUNNER_TEMP"
          cli/runtime/without-nix.sh "$RUNNER_TEMP/kix-$VERSION-${{ matrix.system }}" .

  # Builds with the machine's Nix (the nix builder in kix.toml), as a user
  # the Nix daemon does not trust, which is how most machines with Nix are
  # set up. cli/runtime/nix-builder.sh checks that the Helm cluster builds
  # to the same YAML under both builders, and that a project choosing the
  # nix builder works with `kix build` and with a plain `nix build`.
  nix-builder:
    needs: [version, release]
    if: needs.version.outputs.build == 'true'
    strategy:
      matrix:
        include:
          # Linux and macOS VMs on the Mac Studio, with Nix in the image. The
          # Linux image's daemon already does not trust the runner user.
          # Spindle runs jobs as root, whom Nix always trusts.
          - system: aarch64-linux
            runner: kix-linux-nix
          - system: aarch64-darwin
            runner: kix-macos-nix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NIX_CONFIG: |
        access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The Mac image ships a damaged ~/.cache/nix (its fetcher cache
      # database is malformed). Nix rebuilds the cache when it is missing.
      - name: Clear the Mac image's Nix cache
        if: runner.os == 'macOS'
        run: rm -rf ~/.cache/nix

      # The Mac image comes with Nix. If its daemon trusts the runner user,
      # limit trust to root, so the check runs untrusted here too.
      - name: Make the runner user untrusted
        if: runner.os == 'macOS'
        run: |
          trusted() { nix store info --json | jq -r .trusted; }
          if [ "$(trusted)" != false ]; then
            echo 'trusted-users = root' | sudo tee -a /etc/nix/nix.conf
            sudo launchctl kickstart -k system/org.nixos.nix-daemon
            sleep 3
          fi
          test "$(trusted)" = false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kix-${{ needs.version.outputs.version }}
          path: dist

      # A rehearsal builds Kix as a version the library does not report,
      # and Kix refuses a library from a newer patch or another minor. So
      # the rehearsal gives the library its version too. The commit is
      # local, so Nix's git fetcher sees it.
      - name: Give the library the rehearsal's version
        if: needs.version.outputs.rehearse == 'true'
        run: |
          sed -i.bak "/^\[workspace.package\]/,/^\[/ s/^version = .*/version = \"$VERSION\"/" cli/Cargo.toml
          rm cli/Cargo.toml.bak
          grep -qx "version = \"$VERSION\"" cli/Cargo.toml
          git -c user.name=rehearsal -c user.email=rehearsal@localhost commit -q -am "Rehearse $VERSION"

      - name: Build with the machine's Nix
        run: |
          tar -xzf "dist/kix-${{ matrix.system }}.tar.gz" -C "$RUNNER_TEMP"
          cli/runtime/nix-builder.sh "$RUNNER_TEMP/kix-$VERSION-${{ matrix.system }}" .

  # Publishes the archives the release job built, once they ran without Nix.
  # This repository is private and so are its releases, so the binaries go
  # to the public kix-run/kix-releases instead. KIX_RELEASES_TOKEN is a
  # fine-grained token with Contents read/write on that repository only.
  # A rehearsal (a manual run with the `rehearse` input) signs the archives
  # with the real release key, builds a copy of the release site the way
  # pages.yml does, and installs from it with the install script and with
  # `kix self install`, so the signing secret, the committed key, the index
  # generator, and both verifiers are checked before a real release. It
  # publishes nothing.
  rehearse-release:
    needs: [version, release]
    if: needs.version.outputs.rehearse == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kix-${{ needs.version.outputs.version }}
          path: dist

      - name: Sign checksums
        env:
          KIX_RELEASE_SIGNING_KEY: ${{ secrets.KIX_RELEASE_SIGNING_KEY }}
        run: |
          scripts/sign-release.sh dist
          test -s dist/SHA256SUMS.sig || { echo "no key is committed, so there is nothing to rehearse"; exit 1; }

      - name: Build a copy of the release site
        env:
          KIX_INDEX_SIGNING_KEY: ${{ secrets.KIX_INDEX_SIGNING_KEY }}
        run: |
          mkdir -p "release-src/v$VERSION" "site/download/$VERSION"
          cp dist/SHA256SUMS dist/SHA256SUMS.sig "release-src/v$VERSION/"
          node web/scripts/release-index.mjs release-src site
          scripts/sign-index.sh site
          cp dist/kix-*.tar.gz "site/download/$VERSION/"
          if [ "$PRERELEASE" = true ]; then
            jq -e --arg v "$VERSION" '.latest != $v and any(.releases[]; .version == $v and .prerelease == true)' site/releases/index.json
          else
            jq -e --arg v "$VERSION" '.latest == $v' site/releases/index.json
          fi

      # A release installs as the latest one. A prerelease is never the
      # latest, so it is named.
      - name: Install with the install script
        run: |
          home="$RUNNER_TEMP/script-home"
          if [ "$PRERELEASE" = true ]; then export KIX_VERSION="$VERSION"; fi
          HOME="$home" KIX_INSTALL_SOURCE="file://$PWD/site" sh web/public/install 2>&1 | tee install.log
          grep -q "Verified SHA256SUMS for Kix $VERSION with release key" install.log
          test "$("$home/.local/bin/kix" --version)" = "kix $VERSION"

      - name: Install with kix self install
        run: |
          home="$RUNNER_TEMP/kix-home"
          HOME="$home" KIX_RELEASE_SOURCE="$PWD/site" \
            "$RUNNER_TEMP/script-home/.local/bin/kix" self install "$VERSION"
          test "$("$home/.local/share/kix/$VERSION/bin/kix" --version)" = "kix $VERSION"

      - name: A changed signature is refused
        run: |
          sig="site/releases/v$VERSION/SHA256SUMS.sig"
          zeros=$(head -c 64 /dev/zero | base64 -w0)
          sed -i "s|^signature=.*|signature=$zeros|" "$sig"
          home="$RUNNER_TEMP/tampered-home"
          if HOME="$home" KIX_RELEASE_SOURCE="$PWD/site" \
            "$RUNNER_TEMP/script-home/.local/bin/kix" self install "$VERSION" 2> refused.log; then
            echo "kix installed a release whose signature was changed"
            exit 1
          fi
          cat refused.log
          grep -q "does not verify against any key built into Kix" refused.log
          test ! -e "$home/.local/share/kix/$VERSION"
          if [ "$PRERELEASE" = true ]; then export KIX_VERSION="$VERSION"; fi
          if HOME="$RUNNER_TEMP/tampered-script-home" KIX_INSTALL_SOURCE="file://$PWD/site" \
            sh web/public/install > refused-script.log 2>&1; then
            cat refused-script.log
            echo "the install script installed a release whose signature was changed"
            exit 1
          fi
          cat refused-script.log

  publish:
    needs: [version, release, without-nix, nix-builder]
    if: needs.version.outputs.release == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    # GitHub-hosted, because it needs the gh CLI, which no self-hosted image
    # has. It runs once per release, for under a minute.
    runs-on: ubuntu-latest
    # Write, to push the release tag to this repository and to start the
    # docs deploy.
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kix-${{ needs.version.outputs.version }}
          path: dist

      # Sign SHA256SUMS with the release key, so Kix and the install script
      # can check what they download from kix.run. The site lists only
      # releases with a signature. The secret KIX_RELEASE_SIGNING_KEY holds
      # the private key as PEM, and its public half must already be committed
      # as cli/kix/release-keys/<keyid>.pub (see cli/kix/release-keys/README.md).
      - name: Sign checksums
        env:
          KIX_RELEASE_SIGNING_KEY: ${{ secrets.KIX_RELEASE_SIGNING_KEY }}
        run: scripts/sign-release.sh dist

      # A release that already exists in kix-releases is left alone, so a
      # run that published and then failed to tag can be run again.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.KIX_RELEASES_TOKEN }}
          NOTES: ${{ needs.version.outputs.notes }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if gh release view "v$VERSION" --repo kix-run/kix-releases >/dev/null; then
            echo "kix-run/kix-releases already has v$VERSION."
            exit 0
          fi
          printf '%s\n' "$NOTES" > release-notes.md
          # GitHub refuses release notes over 125,000 characters. The notes
          # list breaking changes first, so cutting whole lines from the end
          # drops fixes. The attached change records hold every entry.
          max=120000
          if [ "$(wc -c < release-notes.md)" -gt "$max" ]; then
            head -c "$max" release-notes.md | sed '$d' > release-notes-cut.md
            printf '\n\nThese notes stop here because GitHub limits their length. The file `kix-%s-changes.json`, attached to this release, lists every change.\n' "$VERSION" >> release-notes-cut.md
            mv release-notes-cut.md release-notes.md
          fi
          # A prerelease is marked as one and never becomes GitHub's latest
          # release, matching how kix.run lists it.
          if [ "$PRERELEASE" = true ]; then
            set -- --prerelease --latest=false
          else
            set -- --latest
          fi
          gh release create "v$VERSION" dist/* \
            --repo kix-run/kix-releases \
            --title "kix $VERSION" \
            --notes-file release-notes.md \
            "$@"

      # Last, so a run that fails before this point leaves no tag and the
      # next run tries the release again.
      - name: Tag release
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      # kix.run/docs serves the latest release tag's docs (pages.yml). A tag
      # pushed with this job's token starts no workflow, so the deploy is
      # started here.
      - name: Deploy the release's docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
