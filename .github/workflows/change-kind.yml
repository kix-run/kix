name: Change kind

# Checks that a pull request's change records match what it changes for
# users. scripts/change-kind.py builds a fixed set of clusters twice: at the
# base commit with the base's Kix, and with the head's Kix, the head's
# library, and the base's `clusters/`. Each build uses its own Kix because
# Kix refuses a library of another minor version, which a release pull
# request would otherwise hit. The second build is a head checkout whose `clusters/`
# comes from the base, so an old cluster definition meets the new library.
# A pull request that removes an option and fixes `clusters/` in the same
# change still shows the removal. The script also compares the committed CLI
# surface (cli/kix-cli/tests/snapshots/cli_surface.snap and
# cli/kix-cli/schema/). A cluster that newly fails needs an `error` record
# whose id is in the message. Changed manifests need a record. A removed or
# changed command or flag needs a record with a `cli` field. Rules:
# CLAUDE.md § Versioning and breaking changes.
#
# Same runner and Nix setup as bundle-checks.yml. Both Kix binaries are
# built with cargo in the head's dev shell.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'cli/**'
      - 'kix/**'
      - 'clusters/**'
      - 'scripts/change-kind.py'
      - 'scripts/change_records/**'
      - '.github/workflows/change-kind.yml'

permissions:
  contents: read

concurrency:
  group: change-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-kind:
    runs-on: [self-hosted, spindle-8c-16g]
    timeout-minutes: 60
    env:
      NIX_CONFIG: |
        extra-experimental-features = nix-command flakes pipe-operators
        accept-flake-config = true
        access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Script tests
        run: python3 -m unittest -v change_records.test_change_kind
        working-directory: scripts

      # A worktree outside the checkout, so the head's flake does not copy it.
      - name: Check out the base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE"

      # The head commit with the base's `clusters/`, exactly: files the head
      # adds there are removed first. Nix reads the worktree's index, so the
      # change needs no commit.
      - name: Check out the head with the base's clusters
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/head-build" HEAD
          git -C "$RUNNER_TEMP/head-build" rm -rq clusters
          git -C "$RUNNER_TEMP/head-build" checkout "$BASE" -- clusters

      - name: Change kind
        run: |
          # The single quotes pass the script to the inner bash unexpanded.
          # shellcheck disable=SC2016
          nix develop --command bash -c '
            set -euo pipefail
            # The base builds into its own target directory. When the two
            # builds shared the dev shell target directory, the head linked
            # against the base copy of a workspace crate.
            (cd "$RUNNER_TEMP/base/cli" && CARGO_TARGET_DIR="$RUNNER_TEMP/base-target" cargo build -p kix-cli --bin kix)
            cp "$RUNNER_TEMP/base-target/debug/kix" "$RUNNER_TEMP/kix-base"
            (cd cli && cargo build -p kix-cli --bin kix)
            KIX="${CARGO_TARGET_DIR:-$PWD/cli/target}/debug/kix"
            python3 scripts/change-kind.py --base "$RUNNER_TEMP/base" --head . \
              --head-build "$RUNNER_TEMP/head-build" --kix "$KIX" \
              --base-kix "$RUNNER_TEMP/kix-base"'
