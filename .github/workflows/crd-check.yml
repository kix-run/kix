name: CRD vendoring check

# Every package that ships CRDs keeps them under kix/packages/stable/<pkg>/crds/,
# and a package that grants an operator upstream's roles keeps them under
# kix/packages/stable/<pkg>/rbac/, each vendored from the public URLs in that
# directory's sources.txt by scripts/vendor-crds.py. This job fails when a
# committed file no longer matches its source, which is what a version bump
# that moved the image and forgot the CRDs or roles looks like. Design:
# v2_discussions/146.

on:
  pull_request:
    paths:
      - 'kix/packages/stable/**'
      - 'scripts/vendor-crds.py'
      - 'scripts/vendor_crds/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/crd-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # A Linux VM on the Mac Studio.
    runs-on: kix-linux-nonix
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests
        run: uv run --frozen python -m unittest -v vendor_crds.test_vendor_crds
        working-directory: scripts
      - name: Vendored CRDs match their sources
        run: uv run --frozen scripts/vendor-crds.py --check
