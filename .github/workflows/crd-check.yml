name: CRD vendoring check

# Every package that ships CRDs keeps them under
# kix/packages/<level>/<pkg>/crds/, and a package that grants an operator
# upstream's roles keeps them under kix/packages/<level>/<pkg>/rbac/. Each
# file is vendored by scripts/vendor-crds.py from the public URLs in that
# directory's sources.txt. This job fails when a committed file no longer
# matches its source, which is what a version bump that moved the image and
# forgot the CRDs or roles looks like. The crd-vendoring skill maintains the
# script.

on:
  pull_request:
    paths:
      - 'kix/packages/**'
      - 'scripts/vendor-crds.py'
      - 'scripts/vendor_crds/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/crd-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # A Linux VM on the Mac Studio.
    runs-on: kix-linux-nonix
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Unit tests
        run: uv run --frozen python -m unittest -v vendor_crds.test_vendor_crds
        working-directory: scripts
      - name: Vendored CRDs match their sources
        run: uv run --frozen scripts/vendor-crds.py --check
