[workspace]
resolver = "2"
members = ["kix-cli", "kix", "kix-operator"]

[workspace.metadata.crane]
name = "kix"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kixpkgs/kixpkgs"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"

# Error handling
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
anyhow = "1"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# Output formatting
comfy-table = "7"
owo-colors = "4"
indicatif = "0.17"
ratatui = "0.29"
crossterm = "0.28"

# Diffing
similar = "2"
strsim = "0.11"
rayon = "1"
indexmap = { version = "2", features = ["serde"] }

# K8s
kube = { version = "0.98", features = ["runtime", "client", "unstable-runtime"] }
k8s-openapi = { version = "0.24" }
# Apiserver transport policy (cluster::client): tower stack, HTTP types,
# body buffering for retries, connect-error detection, backoff jitter.
tower = { version = "0.5", features = ["buffer", "util"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
hyper-util = { version = "0.1", features = ["client-legacy"] }
rand = "0.8"

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# DAG
petgraph = "0.7"

# SQLite
rusqlite = { version = "0.31", features = ["bundled"] }

# Hashing
blake3 = "1"
sha2 = "0.10"

# Paths
directories = "6"
tempfile = "3"
walkdir = "2"

# Time
chrono = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Nix FFI bindings
nix-bindings-expr = { git = "https://github.com/nixops4/nix-bindings-rust.git", rev = "7de15fa26057c8cf0b6178ff166e529c09ea89a7" }
nix-bindings-store = { git = "https://github.com/nixops4/nix-bindings-rust.git", rev = "7de15fa26057c8cf0b6178ff166e529c09ea89a7" }
nix-bindings-flake = { git = "https://github.com/nixops4/nix-bindings-rust.git", rev = "7de15fa26057c8cf0b6178ff166e529c09ea89a7" }
nix-bindings-util = { git = "https://github.com/nixops4/nix-bindings-rust.git", rev = "7de15fa26057c8cf0b6178ff166e529c09ea89a7" }
nix-bindings-fetchers = { git = "https://github.com/nixops4/nix-bindings-rust.git", rev = "7de15fa26057c8cf0b6178ff166e529c09ea89a7" }

# Internal crates
kix-lib = { path = "kix" }

# Test dependencies (used as dev-dependencies in member crates)
# Listed here so members can inherit them with .workspace = true
[workspace.dependencies.assert_cmd]
version = "2"

[workspace.dependencies.insta]
version = "1"
features = ["yaml"]

[workspace.dependencies.predicates]
version = "3"
