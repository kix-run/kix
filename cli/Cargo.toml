[workspace]
resolver = "2"
members = ["kix-cli", "kix", "kix-core", "kix-container", "kix-bundle", "kix-operator"]

[workspace.metadata.crane]
name = "kix"

[workspace.package]
version = "0.10.0-rc.2"
edition = "2024"
license = "LicenseRef-Proprietary"
repository = "https://github.com/kix-run/kix"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# YAML read and written by Kix. Pure Rust, and the library kube itself uses.
serde-saphyr = { version = "2", default-features = false, features = ["serialize", "deserialize"] }
yaml-rust2 = { version = "0.13", default-features = false }
# A project's kix.toml
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"] }
# JSON Schema of the `kix plan` and `kix diff` document
schemars = "1"

# Error handling
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
anyhow = "1"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# Output formatting
comfy-table = "7"
owo-colors = "4"
indicatif = "0.18"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
crossterm = "0.29"

# Diffing
similar = "2"
strsim = "0.11"
rayon = "1"
indexmap = { version = "2", features = ["serde"] }

# K8s
kube = { version = "5.0", features = ["runtime", "client", "unstable-runtime"] }
k8s-openapi = { version = "0.29" }
# Apiserver transport policy (cluster::client): tower stack, HTTP types,
# body buffering for retries, connect-error detection, backoff jitter.
tower = { version = "0.5", features = ["buffer", "util"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
hyper-util = { version = "0.1", features = ["client-legacy"] }
fastrand = "2"

# Container registry client (`kix pin`). rustls rather than the platform TLS
# stack, so a static build of Kix behaves the same everywhere; no default
# features, so this does not drag in a second TLS implementation alongside
# the one kube already uses.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-native-roots",
  "json",
  "charset",
  "http2",
] }
base64 = "0.22"

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
# The engine's cluster-operations seam (cluster::ops) is a dyn trait with
# async methods; async-trait boxes the futures so Arc<dyn ClusterOps> works.
async-trait = "0.1"
proptest = "1"

# DAG
petgraph = "0.7"

# Bundles
zstd = "0.14"

# Hashing
blake3 = "1"
sha2 = "0.10"

# Release archives Kix installs (`kix self install`): Ed25519 signatures
# with the ring that rustls already links, and gzip and tar in pure Rust.
ring = "0.17"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }

# Paths
tempfile = "3"
walkdir = "2"

# Time
chrono = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
kix-lib = { path = "kix" }
kix-core = { path = "kix-core" }
kix-container = { path = "kix-container" }
kix-bundle = { path = "kix-bundle" }

# Test dependencies (used as dev-dependencies in member crates)
# Listed here so members can inherit them with .workspace = true
[workspace.dependencies.assert_cmd]
version = "2"

[workspace.dependencies.insta]
version = "1"
features = ["yaml"]

[workspace.dependencies.predicates]
version = "3"
