[package]
name = "kix-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nix FFI wrapper for kix — store, evaluator, caching, error translation"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
rusqlite.workspace = true
blake3.workspace = true
directories.workspace = true
tracing.workspace = true

# Nix FFI bindings (optional, enabled via nix-ffi feature)
nix-bindings-expr = { workspace = true, optional = true }
nix-bindings-store = { workspace = true, optional = true }
nix-bindings-flake = { workspace = true, optional = true }
nix-bindings-util = { workspace = true, optional = true }
nix-bindings-fetchers = { workspace = true, optional = true }

[features]
nix-ffi = [
  "dep:nix-bindings-expr",
  "dep:nix-bindings-store",
  "dep:nix-bindings-flake",
  "dep:nix-bindings-util",
  "dep:nix-bindings-fetchers",
]
test-util = []

[dev-dependencies]
tempfile.workspace = true
