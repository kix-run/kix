# Nix FFI bindings — added when flake packaging is set up (Step 9)
# nix-bindings-expr = { ... }
# nix-bindings-store = { ... }
# nix-bindings-flake = { ... }
# nix-bindings-util = { ... }
# nix-bindings-fetchers = { ... }

[features]
nix-ffi = []  # Enable when nix-bindings-* crates are added as deps
test-util = []  # Exposes mock backend for downstream testing

[dev-dependencies]
tempfile.workspace = true
