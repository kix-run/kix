[package]
name = "kix-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kubernetes manifest generator CLI"

[[bin]]
name = "kix"
path = "src/main.rs"

[dependencies]
kix-lib.workspace = true
kix-bundle.workspace = true
serde.workspace = true
kube.workspace = true
clap.workspace = true
clap_complete.workspace = true
miette.workspace = true
serde_json.workspace = true
sha2.workspace = true
schemars.workspace = true
comfy-table.workspace = true
owo-colors.workspace = true
indicatif.workspace = true
ratatui.workspace = true
crossterm.workspace = true
tokio.workspace = true
tempfile.workspace = true
petgraph.workspace = true
chrono.workspace = true
# Reads back the kix.toml `kix upgrade` writes.
toml.workspace = true
blake3.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Ranks package names for a `kix status --package` that matches none.
strsim.workspace = true

[dependencies.k8s-openapi]
workspace = true
features = ["latest"]

[dev-dependencies]
# The in-memory apiserver, `kix::cluster::fake_api`.
kix-lib = { workspace = true, features = ["test-util"] }
assert_cmd.workspace = true
insta.workspace = true
predicates.workspace = true
proptest.workspace = true
# Signed release fixtures for `kix self install` and selection.
ring.workspace = true
flate2.workspace = true
tar.workspace = true
base64.workspace = true
