[package]
name = "kix-lib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kix library — Nix evaluation, K8s manifest handling, and cluster operations"

[lib]
name = "kix"
path = "src/lib.rs"

[dependencies]
# Serialization
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
# Helm renders: an event parser, so Kix chooses each scalar's JSON type
yaml-rust2.workspace = true
# A project's kix.toml
toml.workspace = true
# The plan document's JSON Schema
schemars.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Diffing
similar.workspace = true
strsim.workspace = true
rayon.workspace = true
indexmap.workspace = true

# Output formatting
owo-colors.workspace = true

# K8s
kube.workspace = true
k8s-openapi = { workspace = true, features = ["latest"] }
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
tower.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
hyper-util.workspace = true
fastrand.workspace = true

# DAG
petgraph.workspace = true

# SQLite (eval caching)
rusqlite.workspace = true

# Container registry (`kix pin`)
reqwest.workspace = true
base64.workspace = true

# Plan files (`plan::file`)
kix-container.workspace = true

# Hashing
blake3.workspace = true
sha2.workspace = true

# Installing Kix releases (`release`)
ring.workspace = true
flate2.workspace = true
tar.workspace = true

# Paths
walkdir.workspace = true
tempfile.workspace = true

# Time
chrono.workspace = true

# Logging
tracing.workspace = true

[features]
test-util = []

[dev-dependencies]
# Tests read plan files with zstd's own decoder too.
zstd.workspace = true
tempfile.workspace = true
insta.workspace = true
proptest.workspace = true
# Paused-clock tests for the deploy engine (start_paused, time::advance).
tokio = { workspace = true, features = ["test-util"] }
