[package]
name = "kix-lib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kix library — Nix evaluation, K8s manifest handling, and cluster operations"

[lib]
name = "kix"
path = "src/lib.rs"

[dependencies]
# Evaluation, project configuration, and manifest handling
kix-core.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
# The plan document's JSON Schema
schemars.workspace = true

# Error handling
thiserror.workspace = true

# K8s
kube.workspace = true
k8s-openapi = { workspace = true, features = ["latest"] }
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
tower.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
hyper-util.workspace = true
fastrand.workspace = true

# DAG
petgraph.workspace = true

# Container registry (`kix pin`)
reqwest.workspace = true
base64.workspace = true

# Plan files (`plan::file`)
kix-container.workspace = true

# Hashing
sha2.workspace = true

# Installing Kix releases (`release`)
ring.workspace = true
flate2.workspace = true
tar.workspace = true

# Paths
walkdir.workspace = true
tempfile.workspace = true

# Time
chrono.workspace = true

# Logging
tracing.workspace = true

[features]
test-util = ["kix-core/test-util"]

[dev-dependencies]
# Reads `written.toml` in the cluster state fixtures.
toml.workspace = true
kix-core = { workspace = true, features = ["test-util"] }
# Tests read plan files with zstd's own decoder too.
zstd.workspace = true
tempfile.workspace = true
proptest.workspace = true
# Paused-clock tests for the deploy engine (start_paused, time::advance).
tokio = { workspace = true, features = ["test-util"] }
