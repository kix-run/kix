<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Kix</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #fafcf8;
        --foreground: #1f363d;
        --muted: #5b7078;
        --primary: #2f6f52;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #12191b;
          --foreground: #eef4f2;
          --muted: #9aacb1;
          --primary: #7fc0a1;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family:
          'Geist Variable',
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 34rem;
        margin: 0;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.875rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 0.75rem;
      }
      h1 {
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        line-height: 1.2;
        margin: 0 0 0.75rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
      }
      a {
        color: var(--primary);
        font-weight: 500;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>That page does not exist. It may have moved, or the link may be wrong.</p>
      <div class="links">
        <a href="/">Home</a>
        <a href="/docs/">Documentation</a>
        <a href="/llms.txt">llms.txt</a>
      </div>
    </main>
  </body>
</html>
