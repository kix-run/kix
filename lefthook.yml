# Pre-commit hooks for kixpkgs
# Install: lefthook install
#
# Rust hooks adapted from lithus monorepo pattern (no mise — uses cargo directly)

commit-msg:
  commands:
    no-co-authored-by:
      run: |
        if grep -qi "^Co-Authored-By:" "{1}"; then
          echo "ERROR: Co-Authored-By trailers are not allowed in commit messages."
          echo "Please remove the Co-Authored-By line and try again."
          exit 1
        fi

post-commit:
  commands:
    verify-signature:
      run: |
        status=$(git log --pretty=format:'%G?' -1 HEAD)
        if [ "$status" != "G" ] && [ "$status" != "U" ]; then
          echo "ERROR: Commit is not signed. Please amend with: git commit --amend -S"
          exit 1
        fi

pre-push:
  commands:
    verify-signatures:
      run: |
        upstream=$(git rev-parse --abbrev-ref '@{upstream}' 2>/dev/null) || exit 0
        range="${upstream}..HEAD"
        unsigned=$(git log --pretty=format:'%H %G? %s' "$range" 2>/dev/null | grep -E '^[a-f0-9]+ N ' || true)
        if [ -n "$unsigned" ]; then
          echo "ERROR: Unsigned commits found:"
          echo "$unsigned" | while IFS=' ' read -r hash status msg; do
            echo "  $hash $msg"
          done
          echo ""
          echo "Sign commits with: git rebase --exec 'git commit --amend --no-edit -S' $upstream"
          exit 1
        fi

pre-commit:
  commands:
    format-rust:
      glob: "cli/**/*.rs"
      root: "cli/"
      run: cargo fmt --check

    clippy-rust:
      glob: "cli/**/*.rs"
      run: devenv shell -- bash -c 'cd cli && cargo clippy --workspace --all-targets -- -D warnings'

    nixfmt:
      glob: "*.nix"
      run: nix shell nixpkgs#nixfmt -c nixfmt --check {staged_files}

    format-python:
      glob: "scripts/**/*.py"
      run: python3 -m black --check --line-length 120 {staged_files}
