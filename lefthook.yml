# Pre-commit hooks for the Kix repository
# Install: lefthook install
#
# Rust hooks adapted from lithus monorepo pattern (no mise: uses cargo directly)

# A hook that cannot find lefthook fails the commit or push. Without this,
# the script `lefthook install` writes prints "Can't find lefthook in PATH"
# and exits 0, so every check here is skipped. That happens outside the dev
# shell once `nix store gc` has removed the lefthook store path the script
# was installed with; `nix develop` reinstalls it (flake.nix shellHook).
assert_lefthook_installed: true
#
# .github/workflows/lint.yml runs the nixfmt, deadnix, and Co-Authored-By
# checks on every pull request too, for commits made without these hooks.

# The installed git hooks run lefthook through Nix rather than looking for it
# on PATH. Their own lookup prints "Can't find lefthook in PATH" and lets the
# commit through unchecked, which is what happens in a shell outside devenv.
# Nix is needed for the hooks below anyway, and once nixpkgs is evaluated
# this costs about 0.1 s. A command rather than a script in the repository
# keeps the hooks working on branches cut before this line. `--inputs-from .`
# takes lefthook from this flake's locked nixpkgs, as nixfmt and deadnix do,
# not from the committer's registry.
lefthook: "nix run --inputs-from . nixpkgs#lefthook --"

commit-msg:
  commands:
    no-co-authored-by:
      run: |
        if grep -qi "^Co-Authored-By:" "{1}"; then
          echo "ERROR: Co-Authored-By trailers are not allowed in commit messages."
          echo "Please remove the Co-Authored-By line and try again."
          exit 1
        fi

post-commit:
  commands:
    verify-signature:
      run: |
        status=$(git log --pretty=format:'%G?' -1 HEAD)
        if [ "$status" != "G" ] && [ "$status" != "U" ]; then
          echo "ERROR: Commit is not signed. Please amend with: git commit --amend -S"
          exit 1
        fi

pre-push:
  parallel: true
  commands:
    verify-signatures:
      run: |
        upstream=$(git rev-parse --abbrev-ref '@{upstream}' 2>/dev/null) || exit 0
        range="${upstream}..HEAD"
        unsigned=$(git log --pretty=format:'%H %G? %s' "$range" 2>/dev/null | grep -E '^[a-f0-9]+ N ' || true)
        if [ -n "$unsigned" ]; then
          echo "ERROR: Unsigned commits found:"
          echo "$unsigned" | while IFS=' ' read -r hash status msg; do
            echo "  $hash $msg"
          done
          echo ""
          echo "Sign commits with: git rebase --exec 'git commit --amend --no-edit -S' $upstream"
          exit 1
        fi

pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    # Use the active toolchain when `cargo-fmt` works in the current shell
    # (`nix develop`, `devenv shell`, or a configured rustup toolchain), and
    # fall back to `nix develop` when the host has no default rustup toolchain.
    # Invoke `cargo-fmt` directly rather than `cargo fmt` so cargo does not
    # dispatch through a broken rustup shim in $CARGO_HOME/bin.
    format-rust:
      glob: "cli/**/*.rs"
      run: |
        if cargo-fmt --version >/dev/null 2>&1; then
          (cd cli && cargo-fmt --check)
        else
          nix develop -c bash -c 'cd cli && cargo-fmt --check'
        fi

    # Run clippy directly when the current shell already provides a working
    # `cargo-clippy` (`nix develop`, `devenv shell`, or a configured rustup
    # toolchain), falling back to `devenv shell` when devenv is on PATH, or
    # `nix develop` otherwise. Keep CARGO_TARGET_DIR under ~/.cache so a host
    # rustup run never writes cli/target/ inside the checkout.
    clippy-rust:
      glob: "cli/**/*.rs"
      run: |
        if cargo-clippy --version >/dev/null 2>&1; then
          export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/kix-cargo-target/$(basename "$PWD")-$(printf %s "$PWD" | sha256sum | cut -c1-12)}"
          (cd cli && cargo-clippy --workspace --all-targets -- -D warnings)
        elif command -v devenv >/dev/null 2>&1; then
          devenv shell -- bash -c 'cd cli && cargo-clippy --workspace --all-targets -- -D warnings'
        else
          nix develop -c bash -c 'cd cli && cargo-clippy --workspace --all-targets -- -D warnings'
        fi

    # The .nix files under docs/src/snippets are region extracts, not
    # standalone Nix files: each one starts mid-expression at the
    # indentation of the source it was cut from, so nixfmt cannot parse
    # it. They also have to stay byte-identical to their source region
    # or the drift check against kix-examples fails. treefmt excludes
    # them for the same reason (devenv.nix).
    nixfmt:
      glob: "*.nix"
      exclude:
        - "docs/src/snippets/**/*.nix"
      # `--inputs-from .` takes nixfmt from this flake's locked nixpkgs, as
      # deadnix below and the lint workflow do.
      run: nix shell --inputs-from . nixpkgs#nixfmt -c nixfmt --check {staged_files}

    # Check for unused bindings. Attrset pattern names are exempt: Kix reads
    # them with builtins.functionArgs to resolve a package's dependencies.
    # `--inputs-from .` takes deadnix from this flake's locked nixpkgs, not
    # the machine's registry. deadnix before 1.3 cannot parse the `|>` pipe
    # operator: it prints a parse error and passes the file unchecked.
    deadnix:
      glob: "*.nix"
      exclude:
        - "docs/src/snippets/**/*.nix"
      run: nix run --inputs-from . nixpkgs#deadnix -- --fail --no-lambda-pattern-names {staged_files}

    format-python:
      glob: "scripts/**/*.py"
      run: |
        if command -v devenv >/dev/null 2>&1; then
          devenv shell -- treefmt {staged_files}
        elif command -v ruff >/dev/null 2>&1; then
          ruff format --check {staged_files}
        else
          nix shell --inputs-from . nixpkgs#ruff -c ruff format --check {staged_files}
        fi

    # Type-check the landing page. This is the check the Pages deploy runs
    # first (`npm run build` starts with `astro check`). The deploy runs only
    # after a merge to main, where a failure stops kix.run from updating, so
    # this hook catches the failure before the commit.
    typecheck-web:
      glob: "web/**/*.{ts,astro,mjs}"
      run: bash -c 'cd web && ./node_modules/.bin/astro check'
