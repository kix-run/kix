# Pre-commit hooks for kixpkgs
# Install: lefthook install
#
# Rust hooks adapted from lithus monorepo pattern (no mise — uses cargo directly)

commit-msg:
  commands:
    no-co-authored-by:
      run: |
        if grep -qi "^Co-Authored-By:" "{1}"; then
          echo "ERROR: Co-Authored-By trailers are not allowed in commit messages."
          echo "Please remove the Co-Authored-By line and try again."
          exit 1
        fi

post-commit:
  commands:
    verify-signature:
      run: |
        status=$(git log --pretty=format:'%G?' -1 HEAD)
        if [ "$status" != "G" ] && [ "$status" != "U" ]; then
          echo "ERROR: Commit is not signed. Please amend with: git commit --amend -S"
          exit 1
        fi

pre-push:
  parallel: true
  commands:
    verify-signatures:
      run: |
        upstream=$(git rev-parse --abbrev-ref '@{upstream}' 2>/dev/null) || exit 0
        range="${upstream}..HEAD"
        unsigned=$(git log --pretty=format:'%H %G? %s' "$range" 2>/dev/null | grep -E '^[a-f0-9]+ N ' || true)
        if [ -n "$unsigned" ]; then
          echo "ERROR: Unsigned commits found:"
          echo "$unsigned" | while IFS=' ' read -r hash status msg; do
            echo "  $hash $msg"
          done
          echo ""
          echo "Sign commits with: git rebase --exec 'git commit --amend --no-edit -S' $upstream"
          exit 1
        fi

pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    # rustfmt does no compilation, so it needs neither devenv nor the Nix
    # FFI libs — running it on the host keeps this well under a second.
    format-rust:
      glob: "cli/**/*.rs"
      run: bash -c 'cd cli && cargo fmt --check'

    # Clippy compiles, so it does need devenv shell: the FFI crates find
    # the Nix C libraries (nix-expr-c, etc.) via PKG_CONFIG_PATH.
    #
    # This is affordable only because of two things, and it goes back to
    # being unusable if either regresses:
    #   1. Every package in `packages` must actually build. Nix does not
    #      cache failed builds, so one broken package (this was `wrangler`
    #      on aarch64-darwin) makes EVERY shell entry re-attempt it — 60-105s
    #      each, twice per commit, and the hook then fails without ever
    #      running clippy.
    #   2. devenv.nix sets CARGO_TARGET_DIR to its own directory. Sharing
    #      cli/target/ with a host rustup toolchain makes the two compiler
    #      versions invalidate each other's fingerprints, so every run is a
    #      cold build.
    # With both holding: ~6s shell entry + ~3s warm clippy.
    #
    # Nothing else covers this — the only CI workflow (pages.yml) builds the
    # site and never lints — so it must not simply be dropped.
    clippy-rust:
      glob: "cli/**/*.rs"
      run: devenv shell -- bash -c 'cd cli && cargo clippy --workspace --all-targets -- -D warnings'

    # The .nix files under docs/src/snippets are region extracts, not
    # standalone Nix files: each one starts mid-expression at the
    # indentation of the source it was cut from, so nixfmt cannot parse
    # it. They also have to stay byte-identical to their source region
    # or the drift check against kix-examples fails. treefmt excludes
    # them for the same reason (devenv.nix).
    nixfmt:
      glob: "*.nix"
      exclude:
        - "docs/src/snippets/**/*.nix"
      run: nix shell nixpkgs#nixfmt-rfc-style -c nixfmt --check {staged_files}

    format-python:
      glob: "scripts/**/*.py"
      run: devenv shell -- treefmt {staged_files}

    # Type-check the landing page. This is the exact check the Pages
    # deploy runs (`tsc -b`, with noEmit set in tsconfig.app.json).
    # A tsc failure only surfaces in CI, and because GitHub Pages
    # artifacts expire after ~1 day, a broken build streak silently
    # takes kix.run offline once the last good artifact ages out.
    # Catching it here keeps a red build from ever reaching main.
    typecheck-web:
      glob: "web/**/*.{ts,tsx}"
      run: bash -c 'cd web && ./node_modules/.bin/tsc -b'
