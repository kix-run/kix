# PrometheusRule enabled (in addition to full.yaml features).
# Flake package: valkey-prometheusrule
sentinel:
  enabled: true
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
    rules:
      - alert: ValkeyDown
        expr: valkey_up == 0
        for: 5m
        labels:
          severity: critical
networkPolicy:
  enabled: true
